<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgroPulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
/* Layout: fixed left rail of modules, working area on the right; tables and map are the main surfaces. */
:root{
  --paper:#eef1f3; --surface:#ffffff; --ink:#263238; --muted:#5f6b73; --line:#e0e4e7;
  --accent:#2e7d32; --accent-soft:#e8f5e9; --accent-ink:#ffffff; --stripe:#43a047; --link:#1976d2;
  --wheat:#b9852a; --good:#2e7d32; --warn:#b26a00; --bad:#c62828; --info:#1976d2;
  --rail:#2f363b; --rail-ink:#d4d9dd; --rail-active:#3a4248; --top:#ffffff; --topH:52px;
  --font:"Roboto", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:4px; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121714; --surface:#1a211d; --ink:#e4ebe6; --muted:#97a59c; --line:#2c3630;
    --accent:#5fae84; --accent-soft:#213229; --accent-ink:#0f1512;
    --wheat:#d9a54a; --good:#5fbf86; --warn:#e0a84a; --bad:#e2766e; --info:#7aa7d6;
    --rail:#0f1315; --rail-ink:#b8c0c6; --rail-active:#262d31; --top:#161b1e; --stripe:#66bb6a; --link:#64b5f6; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121714; --surface:#1a211d; --ink:#e4ebe6; --muted:#97a59c; --line:#2c3630;
  --accent:#5fae84; --accent-soft:#213229; --accent-ink:#0f1512;
  --wheat:#d9a54a; --good:#5fbf86; --warn:#e0a84a; --bad:#e2766e; --info:#7aa7d6;
  --rail:#0f1315; --rail-ink:#b8c0c6; --rail-active:#262d31; --top:#161b1e; --stripe:#66bb6a; --link:#64b5f6; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.topbar{position:sticky;top:0;z-index:12;height:var(--topH);background:var(--top);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 16px}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);font-weight:700;font-size:18px;min-width:200px;text-decoration:none}
.brand svg{flex:none}
.topbar .org{margin-left:auto;font-size:13px;color:var(--muted)}
.topbar .ava{width:32px;height:32px;border-radius:50%;background:var(--stripe);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:500;flex:none}
.app{display:grid;grid-template-columns:230px 1fr;min-height:calc(100% - var(--topH))}
.rail{background:var(--rail);color:var(--rail-ink);padding:6px 0 12px;display:flex;flex-direction:column;position:sticky;top:var(--topH);height:calc(100vh - var(--topH));overflow:auto}
.rail a{display:flex;align-items:center;gap:10px;color:var(--rail-ink);text-decoration:none;padding:8px 18px;font-weight:400}
.rail a:hover{background:rgba(255,255,255,.06);color:#fff}
.rail a.on{background:var(--rail-active);color:#fff;box-shadow:inset 3px 0 0 var(--stripe)}
.rail .sec{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:#8a949c;padding:14px 18px 6px}
.rail .season{margin-top:auto;padding:12px 18px;border-top:1px solid rgba(255,255,255,.08);display:grid;gap:6px;font-size:12px}
.rail .season select{background:#3a4248;border:1px solid #4a535a;color:#fff;border-radius:4px;padding:6px}
main{padding:20px 24px 60px;min-width:0}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.top h1{font-size:20px;margin:0;text-wrap:balance;font-weight:500}
.top .sp{flex:1}
.btn{border:1px solid #cfd6db;background:var(--surface);border-radius:4px;padding:0 14px;min-height:36px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{padding:0 9px;min-height:28px;font-size:12px}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h2{font-size:15px;margin:0 0 12px;font-weight:500}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi b{display:block;font-size:24px;font-variant-numeric:tabular-nums;font-weight:500}
.kpi span{color:var(--muted);font-size:12px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500;background:#f5f7f8;position:sticky;top:0;white-space:nowrap}
td.n,th.n{text-align:right;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--accent-soft)}
tr.grp td{background:color-mix(in srgb,var(--paper) 70%,var(--surface));font-weight:600}
tr.sub td{font-weight:600;color:var(--muted);background:color-mix(in srgb,var(--paper) 35%,var(--surface))}
tr:last-child td{border-bottom:0}
.muted{color:var(--muted)}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.st-planned{background:color-mix(in srgb,var(--info) 14%,transparent);color:var(--info)}
.st-progress{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.st-done{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.st-cancel{background:color-mix(in srgb,var(--muted) 16%,transparent);color:var(--muted)}
.crop{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none;border:1px solid rgba(0,0,0,.15)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.filters input,.filters select,.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 9px;min-width:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--stripe)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:6px}
.map{position:relative;background:color-mix(in srgb,var(--paper) 50%,var(--surface));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;height:440px;touch-action:none}
.map svg{width:100%;height:100%;display:block;cursor:grab}
.map svg.drag{cursor:grabbing}
.map path{stroke:color-mix(in srgb,var(--ink) 55%,transparent);stroke-width:1;vector-effect:non-scaling-stroke;fill-opacity:.82;cursor:pointer}
.map path:hover{fill-opacity:1;stroke:var(--ink);stroke-width:2}
.map path.sel{stroke:var(--bad);stroke-width:3}
.map text{fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round;pointer-events:none;font-weight:600}
.map .ctl{position:absolute;top:10px;left:10px;display:flex;flex-direction:column;gap:4px}
.map .ctl button{width:32px;height:32px;border:1px solid var(--line);background:var(--surface);border-radius:6px;cursor:pointer;font-size:16px;font-weight:600}
.map .scale{position:absolute;left:10px;bottom:10px;font-size:11px;color:var(--muted);background:var(--surface);padding:2px 6px;border-radius:4px;border:1px solid var(--line)}
.map .tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);padding:6px 8px;border-radius:6px;font-size:12px;display:none;max-width:240px;z-index:2}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px}
.overlay{position:fixed;inset:0;background:rgba(10,15,12,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:20}
.modal{background:var(--surface);border-radius:6px;border:1px solid var(--line);width:min(720px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.wide{width:min(980px,100%)}
.modal header{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);gap:10px}
.modal header h3{margin:0;font-size:16px;flex:1}
.modal .body{padding:16px 18px;display:grid;gap:14px}
.modal footer{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.modal footer .sp{flex:1}
.f{display:grid;gap:10px 14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.f label{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
.f label.full{grid-column:1/-1}
.f textarea{min-height:60px;resize:vertical}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:4px 10px;max-height:150px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:8px}
.checks label{display:flex;gap:6px;align-items:center;color:var(--ink);font-size:13px}
.apps{display:grid;gap:6px}
.approw{display:grid;grid-template-columns:2fr 1fr 90px 32px;gap:6px;align-items:center}
.approw input,.approw select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 8px;min-width:0}
.note{font-size:12px;color:var(--muted)}
.banner{background:color-mix(in srgb,var(--wheat) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--wheat) 40%,var(--line));border-radius:var(--r);padding:10px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.err{background:color-mix(in srgb,var(--bad) 10%,var(--surface));border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.toast{position:fixed;right:16px;bottom:16px;background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:8px;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.rot td{min-width:110px}
.chip{display:inline-flex;gap:6px;align-items:center;padding:3px 8px;border-radius:5px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:var(--surface)}
.chip.none{color:var(--muted);font-weight:400;border-style:dashed}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.dl dt{color:var(--muted)}
.dl dd{margin:0;font-variant-numeric:tabular-nums}
.menu-btn{display:none}
.mapbox{position:relative;height:480px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#1d2a22}
.mapgl{position:absolute;inset:0}
.mtools{position:absolute;top:10px;left:10px;display:flex;gap:4px;z-index:2;flex-wrap:wrap}
.mtools button,.drawbar button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:5px 10px;cursor:pointer;font-weight:600;font-size:12px}
.mtools button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.drawbar{position:absolute;left:10px;right:10px;bottom:34px;z-index:3;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.drawbar[hidden]{display:none}
.drawbar span{flex:1;min-width:160px;font-size:12px}
.drawbar button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.maplibregl-popup-content{font-family:var(--font);font-size:12px;color:#1c2420;padding:8px 10px}
.mapnote{position:absolute;top:50px;left:10px;z-index:2;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:12px;max-width:280px}
.filedrop{border:1.5px dashed var(--line);border-radius:8px;padding:14px;text-align:center;color:var(--muted);margin:6px 0}
.filedrop.over{border-color:var(--accent);background:var(--accent-soft)}
.linkish{color:var(--link);cursor:pointer;text-decoration:underline}
.filerow{display:flex;gap:10px;align-items:center;padding:4px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.filerow a:first-child{flex:1;min-width:160px;color:var(--ink)}
.fpwrap{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.fpside{flex:0 0 220px;position:sticky;top:calc(var(--topH) + 12px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.fpthumb{display:block;width:100%;height:120px;background:#e9edf0}
.fpname{padding:12px 14px 8px}.fpname h1{margin:0 0 4px;font-size:20px;font-weight:700;word-break:break-word}
.fpside nav{display:flex;flex-direction:column;padding-bottom:8px}
.fpside nav a{padding:6px 14px;color:var(--link);text-decoration:none;font-size:13px}
.fpside nav a:hover{background:var(--accent-soft)}
.fpside nav a.on{background:var(--link);color:#fff}
.fpmain{flex:1 1 640px;min-width:0}
.fptop{margin-bottom:10px}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.subtabs button{border:1px solid #cfd6db;background:var(--surface);color:var(--link);border-radius:4px;padding:0 14px;min-height:34px;cursor:pointer;font-weight:500}
.subtabs button.on{background:var(--link);border-color:var(--link);color:#fff}
.fprow1{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.3fr);gap:16px;align-items:start}
.fpmapcard .mapbox{height:430px}
.gdd{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}.gdd b{display:block;font-size:18px;font-weight:500}.gdd span{font-size:11px;color:var(--muted)}
.fpcharts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}
@media (max-width:1200px){.fprow1{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.fpmapcard{grid-column:1/-1}}
.trkpanel{position:fixed;left:12px;right:12px;bottom:12px;z-index:40;max-width:560px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 30px rgba(0,0,0,.25);padding:12px 14px}
.trkhead{display:flex;gap:10px;align-items:baseline;margin-bottom:6px}.trkhead b{color:var(--bad)}
.trkbody{display:flex;gap:12px;align-items:center}.trksvg{flex:none;width:120px;min-height:80px;background:var(--paper);border-radius:6px;display:grid;place-items:center}
.trkbtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.trkbtns .btn{min-height:44px}
.herebox{position:absolute;left:10px;bottom:34px;z-index:3;background:var(--surface);color:var(--ink);border-radius:6px;padding:6px 10px;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.3);max-width:calc(100% - 20px)}
.maplibregl-user-location-dot,.maplibregl-user-location-dot:before{background-color:#1e88e5}
@media (max-width:900px){
  .fpside{position:static;flex:1 1 100%}.fpside nav{flex-direction:row;overflow-x:auto}.fpside nav a{white-space:nowrap}.fpthumb{display:none}
  .fprow1,.fpcharts{grid-template-columns:1fr}
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;inset:var(--topH) auto 0 0;height:auto;width:250px;z-index:15;transform:translateX(-100%);transition:transform .2s}
  .brand{min-width:0} .topbar .org{display:none} .topbar .ava{margin-left:auto}
  .rail.open{transform:none}
  .menu-btn{display:inline-flex}
  main{padding:14px 16px 60px}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .grid>*,.kpis>*{min-width:0}
  .map{height:340px} .mapbox{height:380px}
}
main a:not(.btn){color:var(--link)}
:root[data-theme="dark"] th{background:#1d2427}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) th{background:#1d2427}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="#dash" aria-label="AgroPulse — на головну"><svg width="30" height="30" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="7" fill="#43a047"/><path d="M5 18h6l3-8 4 15 3-10 2 3h6" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>AgroPulse</a>
  <span class="org">ТОВ «КЛГ Агро»</span><span class="ava" id="topAva" aria-hidden="true">А</span>
</header>
<div class="app">
  <nav class="rail" id="rail" aria-label="Розділи">
    <div class="sec">Моніторинг</div>
    <a href="#dash" data-v="dash">Центр моніторингу</a>
    <div class="sec">Виробництво</div>
    <a href="#fields" data-v="fields">Поля і карта</a>
    <a href="#rotation" data-v="rotation">Сівозміна</a>
    <a href="#ops" data-v="ops">Агрооперації</a>
    <a href="#plans" data-v="plans">Планування</a>
    <a href="#scout" data-v="scout">Огляди полів</a>
    <div class="sec">Техніка</div>
    <a href="#machines" data-v="machines">Машини</a>
    <a href="#tasks" data-v="tasks">Завдання техніки</a>
    <a href="#service" data-v="service">Обслуговування</a>
    <a href="#fuel" data-v="fuel">Паливо</a>
    <a href="#harvest" data-v="harvest">Перевезення врожаю</a>
    <div class="sec">Облік</div>
    <a href="#econ" data-v="econ">Економіка</a>
    <a href="#land" data-v="land">Земельний банк</a>
    <a href="#wms" data-v="wms">Склад</a>
    <a href="#refs" data-v="refs">Довідники</a>
    <a href="#users" data-v="users" id="usersLink" hidden>Користувачі</a>
    <a href="#backup" data-v="backup" id="backupLink" hidden>Резервні копії</a>
    <a href="#reports" data-v="reports">Звіти</a>
    <a href="#agrooblik" data-v="agrooblik" id="aoLink" hidden>АгроОблік</a>
    <a href="#telegram" data-v="telegram">Telegram</a>
    <div class="season">
      <label for="seasonSel">Сезон</label>
      <select id="seasonSel"></select>
      <div id="meBox" style="display:grid;gap:4px;margin-top:6px"></div>
      <button class="btn sm" type="button" id="logoutBtn" style="background:transparent;color:var(--rail-ink);border-color:#33433a;margin-top:6px">Вийти</button>
    </div>
  </nav>
  <main id="main"></main>
</div>
<div id="modalRoot"></div>
<script>
"use strict";
/* ---------- constants ---------- */
const CROPS = {
  "Кукурудза":"#3b6fd8","Соняшник":"#e6d92e","Ріпак озимий":"#d38498","Пшениця озима":"#3aa05a",
  "Пшениця яра":"#7cc489","Ячмінь озимий":"#c9a227","Ячмінь ярий":"#dcc062","Соя":"#8c6bb1","Горох":"#9ad06b",
  "Жито озиме":"#b48a5a","Овес":"#cfb88a","Гречка":"#a0522d","Еспарцет":"#6fbfa0","Люцерна":"#4f9d8a",
  "Гірчиця":"#f0b429","Пар":"#c8c8c8","Не вказана":"#e0e0e0"

/* ---------- geometry ---------- */
function ringArea(ring){ // ring: [[lng,lat],...] → hectares
  if(!ring || ring.length < 3) return 0;
  const lat0 = ring.reduce((t,p)=>t+p[1],0)/ring.length * Math.PI/180;
  const kx = 111320*Math.cos(lat0), ky = 110540;
  let a = 0;
  for(let i=0;i<ring.length;i++){ const p=ring[i], q=ring[(i+1)%ring.length]; a += (p[0]*kx)*(q[1]*ky) - (q[0]*kx)*(p[1]*ky); }
  return Math.abs(a)/2/10000;
}
const contourArea = cs => (cs||[]).reduce((t,r)=>t+ringArea(r),0);

}
function applyDocs(docs){
  for(const d of docs){
    if(!S[d.col]) continue;
    const i = S[d.col].findIndex(x => x.id === d.id);
    if(d.deleted){ if(i >= 0) S[d.col].splice(i, 1); }
    else { const obj = Object.assign({ id: d.id }, d.data); if(i >= 0) S[d.col][i] = obj; else S[d.col].push(obj); }
  }
}

/* ---------- import KML / GeoJSON ---------- */
function parseGeo(text, fname){
  const out = [];
  if(/\.kml$/i.test(fname) || text.trim().startsWith("<")){
    const x = new DOMParser().parseFromString(text, "text/xml");
    x.querySelectorAll("Placemark").forEach(pm => {
      const name = (pm.querySelector("name")||{}).textContent || "";
      const rings = [];
      pm.querySelectorAll("Polygon").forEach(pg => {
        const c = pg.querySelector("outerBoundaryIs coordinates") || pg.querySelector("coordinates");
        if(c) rings.push(c.textContent.trim().split(/\s+/).map(t => t.split(",").map(Number)).filter(p => isFinite(p[0]) && isFinite(p[1])).map(p => [p[0], p[1]]));
      });
      const ext = {}; pm.querySelectorAll("ExtendedData Data, SimpleData").forEach(d => { ext[d.getAttribute("name")] = (d.querySelector("value")||d).textContent; });
      if(rings.length) out.push({ name: name.trim() || ext.name || ext.Name || "", rings, props: ext });
    });
  } else {
    const j = JSON.parse(text);
    const feats = j.type === "FeatureCollection" ? j.features : (j.type === "Feature" ? [j] : []);
    feats.forEach(ft => {
      const g = ft.geometry; if(!g) return;
      const p = ft.properties || {};
      let rings = [];
      if(g.type === "Polygon") rings = [g.coordinates[0]];
      else if(g.type === "MultiPolygon") rings = g.coordinates.map(pg => pg[0]);
      rings = rings.map(r => r.map(c => [c[0], c[1]]));
      if(rings.length) out.push({ name: String(p.name ?? p.Name ?? p.NAME ?? p.title ?? p["Поле"] ?? "").trim(), rings, props: p });
    });
  }
  return out;
}
function importDialog(){
  openModal({ title: "Імпорт контурів полів", saveLabel: "Імпортувати",
    body: `<p class="note">Файл KML або GeoJSON з контурами. Поле з такою самою назвою отримає новий контур, решта полів створяться автоматично. Площу пораховано з контуру. Більшість GIS-програм і сервісів моніторингу вміють вивантажувати поля у KML.</p>
    <div class="f"><label class="full">Файл<input type="file" id="gFile" accept=".kml,.geojson,.json,application/vnd.google-earth.kml+xml,application/geo+json"></label>
    <label>Група для нових полів<input id="gGroup" list="groupList" placeholder="наприклад, Голованівськ"></label>
    <label>Культура сезону ${seasonLabel(state.season)} для нових<input id="gCrop" list="cropList" placeholder="необов’язково"></label></div>${groupDatalist()}${cropDatalist()}
    <div id="gInfo" class="note"></div>`,
    onSave: async (m) => {
      const file = m.querySelector("#gFile").files[0];
      if(!file){ m.querySelector("#gInfo").textContent = "Оберіть файл."; return false; }
      let items;
      try { items = parseGeo(await file.text(), file.name); } catch(e){ m.querySelector("#gInfo").textContent = "Не вдалося прочитати файл: " + e.message; return false; }
      if(!items.length){ m.querySelector("#gInfo").textContent = "У файлі не знайдено полігонів."; return false; }
      const group = val(m,"gGroup"), crop = val(m,"gCrop");
      let created=0, updated=0, i=0;
      for(const it of items){
        i++; m.querySelector("#gInfo").textContent = `Обробка ${i} з ${items.length}…`;
        const name = it.name || ("Поле " + i);
        const ex = S.fields.find(f => f.name === name);
        const area = +contourArea(it.rings).toFixed(2);
        if(ex){ await save("fields", Object.assign({}, ex, { contours: it.rings, calcArea: area, area: num(ex.area) || area })); updated++; }
        else { const seasons = crop ? { [state.season]: { crop } } : {}; await save("fields", { name, group, area, calcArea: area, contours: it.rings, seasons }); created++; }
      }
      toast(`Готово: нових полів ${created}, оновлено контурів ${updated}`);
    }
  });
}

function fieldCard(f){

  const ops = S.ops.filter(o => o.fieldId === f.id).sort((a,b)=> (b.factFrom||b.plannedFrom||"").localeCompare(a.factFrom||a.plannedFrom||""));
  const years = Object.keys(f.seasons||{}).sort().reverse();
  return `<div class="card">
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px"><h2 style="margin:0;flex:1">${esc(f.name)}</h2><a class="btn sm pri" href="#field-${esc(f.id)}" target="_blank" rel="noopener">Відкрити сторінку поля ↗</a><button class="btn sm" type="button" data-act="editField" data-id="${esc(f.id)}">Редагувати</button><button class="btn sm" type="button" data-act="redraw" data-id="${esc(f.id)}">${f.contours?"Перемалювати контур":"Намалювати контур"}</button><button class="btn sm" type="button" data-act="newOp" data-field="${esc(f.id)}">+ Агрооперація</button></div>
    <dl class="dl">
      <dt>Група</dt><dd>${esc(f.group||"—")}</dd>
      <dt>Оброблювальна площа</dt><dd>${fmt(num(f.area))} га</dd>
      <dt>Офіційна площа</dt><dd>${f.officialArea?fmt(num(f.officialArea))+" га":"—"}</dd>
      <dt>Площа за контуром</dt><dd>${f.calcArea?fmt(num(f.calcArea))+" га":"—"}</dd>
      <dt>Культура ${state.season}</dt><dd>${cropTag(s.crop)} ${esc(s.variety||"")}</dd>
      <dt>Посів / збирання</dt><dd>${fdate(s.sowDate)} / ${fdate(s.harvestDate)}</dd>
      <dt>Урожайність план / факт</dt><dd>${s.plannedYield?fmt(num(s.plannedYield)):"—"} / ${s.yield?fmt(num(s.yield)):"—"} ц/га${s.yield?` · урожай ${fmt(num(s.yield)*num(f.area)/10)} т`:""}</dd>
      ${f.cadastre?`<dt>Кадастрові номери</dt><dd>${esc(f.cadastre)}</dd>`:""}
      ${f.note?`<dt>Примітка</dt><dd>${esc(f.note)}</dd>`:""}
    </dl>
    ${years.length?`<h2 style="margin-top:16px">Історія культур</h2><div class="legend">${years.map(y=>`<span><b>${y}</b> ${cropTag(f.seasons[y].crop)}</span>`).join("")}</div>`:""}
    ${(() => { const ps = S.parcels.filter(p => (p.fieldIds||[]).includes(f.id)); return ps.length ? `<h2 style="margin-top:16px">Земельні ділянки (${ps.length}) · ${fmt(sum(ps,p=>p.area),2)} га</h2><div class="tw"><table><tbody>${ps.map(p => { const l = parcelActiveLease(p); return `<tr class="click" data-parcel="${esc(p.id)}"><td>${esc(p.cadastre||"—")}<div class="note">${esc(nameOf("owners",p.ownerId)||"")}</div></td><td class="n">${fmt(num(p.area),4)} га</td><td>${l?leasePill(l)+`<div class="note">до ${fdate(l.dateTo)}</div>`:`<span class="pill st-cancel">${esc(parcelStatus(p))}</span>`}</td></tr>`; }).join("")}</tbody></table></div>` : ""; })()}
    ${(() => { const rs = S.scoutreports.filter(r => r.fieldId === f.id).sort((a,b)=>(b.date||"").localeCompare(a.date||"")).slice(0,5); return `<h2 style="margin-top:16px">Останні звіти оглядів <button class="btn sm" type="button" data-act="scoutField" data-id="${esc(f.id)}">+ Огляд</button></h2>` + (rs.length ? `<div class="tw"><table><tbody>${rs.map(r => `<tr class="click" data-scout="${esc(r.id)}"><td>${fdate(r.date)}</td><td>${esc(r.stage||"")}</td><td>${(r.threats||[]).map(t => esc(nameOf("plantthreats", t.threatId)||"") + (t.severity ? " " + fmt0(num(t.severity)) + "%" : "")).join(", ") || esc((r.note||"").slice(0,60))}</td><td>${esc(r.author||"")}</td></tr>`).join("")}</tbody></table></div>` : `<p class="note">Оглядів ще не було.</p>`); })()}
    <h2 style="margin-top:16px">Вегетація (NDVI) · сезон ${seasonLabel(state.season)}</h2><div id="ndviBox" data-fid="${esc(f.id)}">${f.contours ? `<p class="note">Завантажую супутникові дані…</p>` : `<p class="note">Потрібен контур поля.</p>`}</div>
    <h2 style="margin-top:16px">Погода</h2><div id="wxBox" data-fid="${esc(f.id)}">${f.contours ? `<p class="note">Завантажую погоду…</p>` : `<p class="note">Погода з’явиться, коли в поля буде контур.</p>`}</div>
    <h2 style="margin-top:16px">Агрооперації (${ops.length})</h2>
    ${ops.length ? `<div class="tw"><table><tbody>${ops.slice(0,15).map(o=>`<tr class="click" data-op="${esc(o.id)}"><td>${esc(opTitle(o))}<div class="note">сезон ${seasonLabel(o.season)} · ${fdate(o.factFrom||o.plannedFrom)}</div></td><td>${statusPill(o.status)}</td><td class="n">${fmt(opDone(o))} / ${fmt(opPlanned(o))} га</td></tr>`).join("")}</tbody></table></div>` : `<p class="note">Ще немає.</p>`}
  </div>`;
}
function fieldDialog(f, contours){
  const isNew = !f; f = f || { name:"", group:state.fieldGroup||"", seasons:{} };
  if(contours){ f = Object.assign({}, f, { contours, calcArea: +contourArea(contours).toFixed(2) }); if(!num(f.area)) f.area = f.calcArea; }
  const s = fieldSeason(f);
  openModal({ title: isNew ? "Нове поле" : "Поле " + f.name, wide: true,
    body: `<div class="f">
      <label>Назва поля<input id="fName" value="${esc(f.name)}" required></label>
      <label>Група полів<input id="fGroup" list="groupList" value="${esc(f.group||"")}"></label>
      <label>Оброблювальна площа, га<input id="fArea" inputmode="decimal" value="${esc(f.area??"")}"></label>
      <label>Офіційна площа, га<input id="fOff" inputmode="decimal" value="${esc(f.officialArea??"")}"></label>
      <label class="full">Кадастрові номери<input id="fCad" value="${esc(f.cadastre||"")}" placeholder="через кому"></label>
    </div>
    <h4 style="margin:4px 0 0">Сезон ${seasonLabel(state.season)}</h4>
    <div class="f">
      <label>Культура<input id="sCrop" list="cropList" value="${esc(s.crop||"")}"></label>
      <label>Сорт / гібрид<input id="sVar" value="${esc(s.variety||"")}"></label>
      <label>Дата посіву<input id="sSow" type="date" value="${esc(s.sowDate||"")}"></label>
      <label>Дата збирання<input id="sHarv" type="date" value="${esc(s.harvestDate||"")}"></label>
      <label>Планова урожайність, ц/га<input id="sPlan" inputmode="decimal" value="${esc(s.plannedYield??"")}"></label>
      <label>Фактична урожайність, ц/га<input id="sYield" inputmode="decimal" value="${esc(s.yield??"")}"></label>
      <label class="full">Примітка<textarea id="fNote">${esc(f.note||"")}</textarea></label>
      <label><span><input type="checkbox" id="fArch" ${f.archived?"checked":""}> В архіві (не рахується в площі)</span></label>
    </div>${cropDatalist()}${groupDatalist()}
    ${f.contours?`<p class="note">Контур: ${f.contours.length} полігон(и), ${fmt(num(f.calcArea))} га за контуром.</p>`:`<p class="note">Контур можна додати імпортом KML/GeoJSON (поле з такою самою назвою).</p>`}`,
    extra: (!isNew && f.contours) ? `<button class="btn" type="button" id="dropC">Прибрати контур</button>` : "",
    onDelete: isNew ? null : async () => { await remove("fields", f.id); if(state.fieldSel===f.id) state.fieldSel=null; },
    onSave: async (m) => {
      const name = val(m,"fName"); if(!name){ m.querySelector("#fName").focus(); return false; }
      const seasons = Object.assign({}, f.seasons||{});
      seasons[state.season] = { crop: val(m,"sCrop"), variety: val(m,"sVar"), sowDate: val(m,"sSow"), harvestDate: val(m,"sHarv"), plannedYield: val(m,"sPlan"), yield: val(m,"sYield") };
      if(!Object.values(seasons[state.season]).some(Boolean)) delete seasons[state.season];
      const id = await save("fields", Object.assign({}, f, { name, group: val(m,"fGroup"), area: num(val(m,"fArea")) || num(f.calcArea), officialArea: val(m,"fOff") ? num(val(m,"fOff")) : "", cadastre: val(m,"fCad"), note: val(m,"fNote"), archived: m.querySelector("#fArch").checked, seasons }));
      if(id) state.fieldSel = id;
      return id ? true : false;
    }
  });
  const dc = document.getElementById("dropC");
  if(dc) dc.onclick = async () => { const c = Object.assign({}, f); delete c.contours; delete c.calcArea; await save("fields", c); closeModal(); };
}

function viewRotation(){
  const years = [state.season-3, state.season-2, state.season-1, state.season, state.season+1];
  const list = [...S.fields].filter(f=>!f.archived).sort((a,b)=> (a.group||"").localeCompare(b.group||"","uk") || a.name.localeCompare(b.name,"uk",{numeric:true}));
  let lastG = null;
  return header("Сівозміна", `<button class="btn" type="button" data-act="csvRot">Експорт</button>`) + statusBanner() + `
  <p class="note">Натисніть на клітинку, щоб вказати культуру поля в потрібному сезоні.</p>
  <div class="tw rot"><table><thead><tr><th>Поле</th><th class="n">Площа, га</th>${years.map(y=>`<th>${y}${y===state.season?" · поточний":""}</th>`).join("")}</tr></thead><tbody>
  ${list.length ? list.map(f => { let g=""; if(f.group!==lastG){ lastG=f.group; g=`<tr class="grp"><td colspan="${years.length+2}">${esc(f.group||"Без групи")}</td></tr>`; }
    return g + `<tr><td>${esc(f.name)}</td><td class="n">${fmt(num(f.area))}</td>${years.map(y => { const c = fieldCrop(f, y); return `<td><span class="chip ${c?"":"none"}" role="button" tabindex="0" data-rot="${esc(f.id)}" data-y="${y}">${c?`<i class="dot" style="background:${esc(cropColor(c))}"></i>${esc(c)}`:"додати"}</span></td>`; }).join("")}</tr>`; }).join("")
  : `<tr><td colspan="${years.length+2}"><div class="empty">Додайте поля, щоб вести сівозміну.</div></td></tr>`}
  </tbody></table></div>
  <div class="card" style="margin-top:16px"><h2>Структура посівів по роках, га</h2>${rotationSummary(years, list)}</div>`;
}
function rotationSummary(years, list){
  const crops = new Set(); years.forEach(y => list.forEach(f => { const c = fieldCrop(f,y); if(c) crops.add(c); }));
  if(!crops.size) return `<p class="note">Немає даних.</p>`;
  return `<div class="tw"><table><thead><tr><th>Культура</th>${years.map(y=>`<th class="n">${y}</th>`).join("")}</tr></thead><tbody>${[...crops].map(c=>`<tr><td>${cropTag(c)}</td>${years.map(y=>{ const a = sum(list.filter(f=>fieldCrop(f,y)===c), f=>f.area); return `<td class="n">${a?fmt(a):"—"}</td>`; }).join("")}</tr>`).join("")}</tbody></table></div>`;
}
function rotationDialog(fid, y){
  const f = byId("fields", fid); const s = fieldSeason(f, y);
  openModal({ title: `${f.name} · сезон ${seasonLabel(y)}`, body: `<div class="f"><label>Культура<input id="rCrop" list="cropList" value="${esc(s.crop||"")}"></label><label>Сорт / гібрид<input id="rVar" value="${esc(s.variety||"")}"></label><label>Фактична урожайність, ц/га<input id="rY" inputmode="decimal" value="${esc(s.yield??"")}"></label></div>${cropDatalist()}`,
    onSave: async (m) => { const seasons = Object.assign({}, f.seasons||{}); const ns = Object.assign({}, s, { crop: val(m,"rCrop"), variety: val(m,"rVar"), yield: val(m,"rY") }); if(Object.values(ns).some(Boolean)) seasons[y] = ns; else delete seasons[y]; return !!(await save("fields", Object.assign({}, f, { seasons }))); } });
}

function viewOps(){
  const F = state.ops; const q = F.q.toLowerCase();
  const ops = S.ops.filter(o => Number(o.season) === state.season && (!F.status || (o.status||"planned")===F.status) && (!F.group || opGroup(o)===F.group)
    && (!q || ((byId("fields",o.fieldId)||{}).name+" "+opTitle(o)+" "+(o.responsible||"")).toLowerCase().includes(q)));
  const tree = {};
  ops.forEach(o => { const g = opGroup(o), t = opTitle(o); ((tree[g] ||= {})[t] ||= []).push(o); });
  const order = Object.keys(WORKS);
  return header("Агрооперації", `<button class="btn" type="button" data-act="csvOps">Експорт</button><button class="btn pri" type="button" data-act="newOp">+ Агрооперація</button>`) + statusBanner() + `
  <div class="filters">
    <input id="oq" placeholder="Пошук: поле, операція, відповідальний" value="${esc(F.q)}" style="flex:1;min-width:200px">
    <select id="og">${opt("", "Всі групи робіт", F.group)}${order.map(g=>opt(g,g,F.group)).join("")}</select>
    <select id="os">${opt("", "Всі статуси", F.status)}${Object.entries(STATUS).map(([k,v])=>opt(k,v,F.status)).join("")}</select>
    <span class="muted">Сезон ${seasonLabel(state.season)} · ${ops.length} операцій</span>
  </div>
  <div class="tw"><table><thead><tr><th>№</th><th>Поле</th><th>Культура</th><th>Статус</th><th>План</th><th>Факт</th><th class="n">План, га</th><th class="n">Виконано, га</th><th>Внесення</th><th>Техніка / водії</th><th>Відповідальний</th></tr></thead><tbody>
  ${ops.length ? order.concat(Object.keys(tree).filter(g=>!order.includes(g))).filter(g=>tree[g]).map(g => {
      const types = tree[g]; const all = Object.values(types).flat();
      return `<tr class="grp"><td colspan="6"><span class="crop"><i class="dot" style="background:${GROUP_COLOR[g]||"#888"}"></i>${esc(g)} <span class="muted">${all.length}</span></span></td><td class="n">${fmt(sum(all,opPlanned))}</td><td class="n">${fmt(sum(all,opDone))}</td><td colspan="3"></td></tr>` +
        Object.entries(types).map(([t, list]) => `<tr class="sub"><td colspan="6">${esc(t)} · ${list.length}</td><td class="n">${fmt(sum(list,opPlanned))}</td><td class="n">${fmt(sum(list,opDone))}</td><td colspan="3"></td></tr>` +
          list.sort((a,b)=>(a.plannedFrom||"").localeCompare(b.plannedFrom||"")).map(o => opRow(o)).join("")).join("");
    }).join("") : `<tr><td colspan="11"><div class="empty"><b>Агрооперацій немає</b>Змініть фільтри або створіть агрооперацію.</div></td></tr>`}
  </tbody></table></div>`;
}
function opRow(o){
  const f = byId("fields", o.fieldId) || {};
  const plan = opPlanned(o), done = opDone(o), p = plan ? Math.min(100, done/plan*100) : 0;
  const apps = (o.applications||[]).map(a => `${esc(nameOf("products",a.productId)||a.name||"")} ${fmt(num(a.rate))} ${esc(a.unit||"")}/га`).join("<br>");
  const mach = (o.machineIds||[]).map(id=>esc(nameOf("machines",id))).filter(Boolean).join(", ");
  const drv = (o.driverIds||[]).map(id=>esc(nameOf("people",id))).filter(Boolean).join(", ");
  return `<tr class="click" data-op="${esc(o.id)}"><td class="muted">${esc(o.number||"")}</td><td>${esc(f.name||"—")}<div class="note">${esc(f.group||"")}</div></td><td>${cropTag(fieldCrop(f, o.season))}</td><td>${statusPill(o.status)}</td>
  <td>${fdate(o.plannedFrom)}${o.plannedTo&&o.plannedTo!==o.plannedFrom?"–"+fdate(o.plannedTo):""}</td><td>${o.factFrom?fdate(o.factFrom)+(o.factTo&&o.factTo!==o.factFrom?"–"+fdate(o.factTo):""):"—"}</td>
  <td class="n">${fmt(plan)}</td><td class="n">${fmt(done)}<div class="bar" style="margin-top:4px"><i style="width:${p}%"></i></div></td><td>${apps||"—"}</td><td>${mach||"—"}${drv?`<div class="note">${drv}</div>`:""}</td><td>${esc(o.responsible||"")}</td></tr>`;
}
function workTypeOptions(sel){ return Object.entries(WORKS).map(([g, ts]) => `<optgroup label="${esc(g)}">${ts.map(t=>opt(t,t,sel)).join("")}</optgroup>`).join(""); }
function appRowHtml(a={}){
  return `<div class="approw"><select class="aP" aria-label="Матеріал">${opt("", "— матеріал —", a.productId)}${PRODUCT_TYPES.map(t => { const ps = sorted("products").filter(p=>p.type===t); return ps.length?`<optgroup label="${esc(t)}">${ps.map(p=>opt(p.id,p.name,a.productId)).join("")}</optgroup>`:""; }).join("")}</select>
  <input class="aR" inputmode="decimal" placeholder="норма на 1 га" value="${esc(a.rate??"")}" aria-label="Норма">
  <select class="aU" aria-label="Одиниця">${UNITS.map(u=>opt(u,u,a.unit||"")).join("")}</select>
  <button class="btn sm aX" type="button" aria-label="Прибрати рядок">×</button></div>`;
}
function opDialog(o, presetField){
  const isNew = !o;
  o = o || { season: state.season, status:"planned", fieldId: presetField || "", workType:"Дискування", applications:[], machineIds:[], driverIds:[], plannedFrom: today() };
  const fields = [...S.fields].filter(f=>!f.archived || f.id===o.fieldId).sort((a,b)=>(a.group||"").localeCompare(b.group||"","uk")||a.name.localeCompare(b.name,"uk",{numeric:true}));
  const linked = isNew ? [] : opTasks(o);
  const m = openModal({ title: isNew ? "Нова агрооперація" : `Агрооперація №${o.number||""}`, wide: true,
    body: `<div class="f">
      <label>Вид робіт<select id="oType">${workTypeOptions(o.workType)}</select></label>
      <label>Своя назва (для «Інше»)<input id="oCustom" value="${esc(o.customName||"")}"></label>
      <label>Поле<select id="oField">${opt("", "— оберіть поле —", o.fieldId)}${fields.map(f=>opt(f.id, `${f.name} · ${f.group||""} · ${fmt(num(f.area))} га`, o.fieldId)).join("")}</select></label>
      <label>Сезон<input id="oSeason" type="number" value="${esc(o.season)}"></label>
      <label>Статус<select id="oStatus">${Object.entries(STATUS).map(([k,v])=>opt(k,v,o.status||"planned")).join("")}</select></label>
      <label>План з<input id="oPF" type="date" value="${esc(o.plannedFrom||"")}"></label>
      <label>План до<input id="oPT" type="date" value="${esc(o.plannedTo||"")}"></label>
      <label>Запланована площа, га<input id="oPA" inputmode="decimal" value="${esc(o.plannedArea??"")}" placeholder="площа поля"></label>
      <label>Факт з<input id="oFF" type="date" value="${esc(o.factFrom||"")}"></label>
      <label>Факт до<input id="oFT" type="date" value="${esc(o.factTo||"")}"></label>
      <label>Виконано, га<input id="oDA" inputmode="decimal" value="${esc(o.doneArea??"")}" ${linked.length?"disabled":""} placeholder="${linked.length?"рахується з завдань техніки":""}"></label>
      <label>Відповідальний<input id="oResp" value="${esc(o.responsible||"")}"></label>
    </div>
    <div><div class="note" style="margin-bottom:6px">Внесення: насіння, ЗЗР, добрива (норма на 1 га). Довідник матеріалів — у розділі «Довідники».</div><div class="apps" id="apps">${(o.applications||[]).map(appRowHtml).join("")}</div><button class="btn sm" type="button" id="addApp" style="margin-top:6px">+ Матеріал</button></div>
    <div class="f">
      <label class="full">Техніка<div class="checks">${sorted("machines").map(x=>`<label><input type="checkbox" name="oM" value="${esc(x.id)}" ${(o.machineIds||[]).includes(x.id)?"checked":""}>${esc(x.name)}</label>`).join("") || `<span class="note">Додайте машини в розділі «Машини»</span>`}</div></label>
      <label class="full">Водії / механізатори<div class="checks">${sorted("people").map(x=>`<label><input type="checkbox" name="oD" value="${esc(x.id)}" ${(o.driverIds||[]).includes(x.id)?"checked":""}>${esc(x.name)}</label>`).join("") || `<span class="note">Додайте людей у «Довідниках»</span>`}</div></label>
      <label>Агрегат / обладнання<select id="oImpl">${optsFrom(sorted("implements"), o.implementId, "—")}</select></label>
      <label class="full">Примітка<textarea id="oNote">${esc(o.note||"")}</textarea></label>
    </div>
    ${linked.length?`<div class="note">Пов’язані завдання техніки: ${linked.length}, разом ${fmt(sum(linked,t=>t.area))} га, пальне ${fmt(sum(linked,t=>t.fuel),0)} л.</div>`:""}`,
    extra: isNew ? "" : `<button class="btn" type="button" id="oIssue">Списати зі складу</button>`,
    onDelete: isNew ? null : async () => remove("ops", o.id),
    onSave: async (m) => {
      const fieldId = val(m,"oField"); if(!fieldId){ m.querySelector("#oField").focus(); return false; }
      const applications = [...m.querySelectorAll(".approw")].map(r => ({ productId: r.querySelector(".aP").value, rate: num(r.querySelector(".aR").value), unit: r.querySelector(".aU").value })).filter(a => a.productId);
      const number = o.number || (Math.max(0, ...S.ops.map(x => Number(x.number)||0)) + 1);
      const workType = val(m,"oType");
      return !!(await save("ops", Object.assign({}, o, { number, workType, workGroup: (Object.entries(WORKS).find(([g,ts])=>ts.includes(workType))||["Інше"])[0], customName: val(m,"oCustom"), fieldId, season: Number(val(m,"oSeason"))||state.season, status: val(m,"oStatus"),

  const area = sum(ts,t=>t.area), fuel = sum(ts,t=>t.fuel), km = sum(ts,t=>num(t.kmField)+num(t.kmRoad)), h = sum(ts,hoursOf);
  return { n: ts.length, area, fuel, km, h, lha: area ? fuel/area : 0 };

const RIGHT_TYPES = ["Оренда","Суборенда","Емфітевзис","Власність","Сервітут","Користування"];
const CP_KINDS = ["Фізична особа","ФОП","Юридична особа"];
const STATUS_BY_DOC = { "Взята в оренду":"Взяті в оренду", "Взята в суборенду":"Взяті в суборенду", "Здана в оренду":"Здані в оренду", "Здана в суборенду":"Здані в суборенду", "Емфітевзис":"Емфітевзис", "Власність":"Власність", "Сервітут":"Сервітут" };
const RENT_DOC_TYPES = ["Взята в оренду","Взята в суборенду","Емфітевзис"];
const CAD_RE = /^\d{10}:\d{2}:\d{3}:\d{4}$/;

function landSettings(){ const s = S.settings.find(x => x.id === "land") || {}; return { pdfo: s.pdfo ?? 18, vz: s.vz ?? 5, renewSoonDays: s.renewSoonDays ?? 180 }; }
const cpName = id => nameOf("owners", id);
function docParcels(l){ return (l.parcelIds || []).map(id => byId("parcels", id)).filter(Boolean); }
function docCalcArea(l){ return sum(docParcels(l), p => num(p.area) * num(l.share || 100) / 100); }
function docArea(l){ return num(l.area) || docCalcArea(l); }
function docNgo(l){ return num(l.ngo) || sum(docParcels(l), p => num(p.ngo) * num(l.share || 100) / 100); }
function docYearPrice(l){ if(l.subtype === "Фіксований в % до НГО") return docNgo(l) * num(l.rentPercent) / 100; return num(l.pricePerYear); }
function docEnd(l){ return l.factEnd || l.dateTo || ""; }
function docState(l){
  const td = today();
  if(l.archived) return "archived";
  if(l.status === "розірваний") return "broken";
  if(["проєкт","підписаний","на реєстрації"].includes(l.status)) return "reg";
  const end = docEnd(l);
  if(end && end < td) return l.autoRenew ? "renewed" : "ended";
  if(end && (new Date(end) - new Date(td)) / 864e5 <= landSettings().renewSoonDays) return "soon";
  return "active";
}
const DSTATE = { active:["Діючий","st-done"], soon:["Закінчується","st-progress"], renewed:["Автоподовжений","st-done"], ended:["Закінчився","st-cancel"], reg:["Оформлення","st-planned"], broken:["Розірваний","st-cancel"], archived:["В архіві","st-cancel"] };
const docIsActive = l => ["active","soon","renewed","reg"].includes(docState(l));
function docPill(l){ const [t, c] = DSTATE[docState(l)]; return `<span class="pill ${c}">${t}</span>`; }
function daysLeft(l){ const e = docEnd(l); if(!e) return null; return Math.round((new Date(e) - new Date(today())) / 864e5); }
function parcelDocs(p){ return S.leases.filter(l => (l.parcelIds || []).includes(p.id)); }
function parcelActiveDoc(p){ return parcelDocs(p).filter(docIsActive).sort((a,b) => (docEnd(b)||"9999").localeCompare(docEnd(a)||"9999"))[0]; }
const parcelActiveLease = parcelActiveDoc;
const leasePill = docPill;
function parcelStatus(p){
  const d = parcelActiveDoc(p);
  if(d) return STATUS_BY_DOC[d.type] || "Без типу";
  if(parcelDocs(p).some(l => ["ended","broken"].includes(docState(l)))) return "Закінчився";
  return "Без типу";
}
function parcelColorKey(p){ const d = parcelActiveDoc(p); if(d && docState(d) === "soon") return "Закінчується"; return parcelStatus(p); }
function parcelRightEnd(p){ return parcelDocs(p).filter(docIsActive).map(docEnd).filter(Boolean).sort().pop() || ""; }
function rentForYear(l, year){
  const price = docYearPrice(l); if(!price) return 0;
  const ys = new Date(year + "-01-01"), ye = new Date(year + "-12-31");
  const a = l.dateFrom ? new Date(l.dateFrom) : ys;
  let b = docEnd(l) ? new Date(docEnd(l)) : ye;
  if(l.autoRenew && b < ye) b = ye;
  const from = a > ys ? a : ys, to = b < ye ? b : ye;
  if(to < from) return 0;
  return price * ((to - from) / 864e5 + 1) / ((ye - ys) / 864e5 + 1);
}
function taxRateFor(l){ const cp = byId("owners", l.ownerId); if(cp && cp.kind === "Юридична особа") return 0; const s = landSettings(); return num(s.pdfo) + num(s.vz); }

function landKpis(){
  const ps = S.parcels.filter(p => !p.archived);
  const act = ps.filter(p => parcelActiveDoc(p));
  const own = ps.filter(p => parcelStatus(p) === "Власність");
  const docs = S.leases.filter(l => !l.archived);
  const year = state.rentYear;
  const rentDocs = docs.filter(l => RENT_DOC_TYPES.includes(l.type));
  const accrued = sum(rentDocs, l => rentForYear(l, year));
  const paid = sum(S.payments.filter(x => Number(x.year) === year), x => num(x.gross) || num(x.net));
  return { ps, act, own, docs, accrued, paid,
    area: sum(ps, p => p.area), actArea: sum(act, p => p.area), ownArea: sum(own, p => p.area), freeArea: sum(ps.filter(p => !parcelActiveDoc(p)), p => p.area),
    activeDocs: docs.filter(docIsActive).length, soon: docs.filter(l => docState(l) === "soon"), ended: docs.filter(l => docState(l) === "ended") };
}

function landOverview(){
  const K = landKpis();
  const councils = {};
  K.ps.forEach(p => { const c = p.council || "Не вказано"; const x = councils[c] ||= { n:0, area:0, act:0, own:0, free:0, ngo:0 }; x.n++; x.area += num(p.area); x.ngo += num(p.ngo); const st = parcelStatus(p); if(st === "Власність") x.own += num(p.area); else if(parcelActiveDoc(p)) x.act += num(p.area); else x.free += num(p.area); });
  const soon = [...K.soon, ...K.ended.filter(l => (daysLeft(l) ?? 0) > -365)].sort((a,b) => (docEnd(a)).localeCompare(docEnd(b))).slice(0, 15);
  return `<div class="kpis">
    <div class="kpi"><b>${K.ps.length}</b><span>ділянок · ${fmt(K.area, 2)} га</span></div>

function rentRows(year){

    return { l, acc, tax, payable: acc - tax, paidGross, paidNet, debt: acc - paidGross };
  }).filter(r => r.acc || r.paidGross);
}

/* intersection analysis with turf */
let turfLoading = null;
function loadScript(src){ return new Promise((ok, fail) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => fail(new Error("Не вдалося завантажити " + src)); document.head.appendChild(s); }); }
function ensureTurf(){ if(window.turf) return Promise.resolve(); return turfLoading ||= loadScript("https://unpkg.com/@turf/turf@7.1.0/turf.min.js"); }
let landAnalysisCache = null;
function landAnalysis(){
  if(!window.turf){ ensureTurf().then(() => { landAnalysisCache = null; render(); }).catch(e => toast(e.message)); return `<div class="card"><div class="empty">Завантажую інструмент для розрахунку перетинів…</div></div>`; }
  const fields = S.fields.filter(f => !f.archived && f.contours && f.contours.length);
  const parcels = S.parcels.filter(p => !p.archived && p.contours && p.contours.length);
  const key = fields.map(f => f.id + f.updatedAt).join() + "|" + parcels.map(p => p.id + p.updatedAt).join() + "|" + S.leases.map(l => l.updatedAt).join();
  if(!landAnalysisCache || landAnalysisCache.key !== key) landAnalysisCache = { key, rows: computeIntersections(fields, parcels) };
  const rows = landAnalysisCache.rows;
  const tot = k => sum(rows, r => r[k]);
  return `<p class="note">Перетин контурів полів із контурами земельних ділянок. Показує, яка частина посівної площі покрита ділянками з діючими документами, а де обробляється земля без документів.</p>

function computeIntersections(fields, parcels){
  const T = window.turf;
  const mp = cs => T.multiPolygon(cs.map(r => [r]));
  const pf = parcels.map(p => { try { const g = mp(p.contours); return { p, g, bb: T.bbox(g), active: !!parcelActiveDoc(p) }; } catch(e){ return null; } }).filter(Boolean);
  return fields.map(f => {
    let fg; try { fg = mp(f.contours); } catch(e){ return null; }
    const fb = T.bbox(fg); const fieldArea = T.area(fg) / 10000;
    let act = 0, noDoc = 0; const hits = [];
    pf.forEach(x => {
      if(x.bb[0] > fb[2] || x.bb[2] < fb[0] || x.bb[1] > fb[3] || x.bb[3] < fb[1]) return;
      let inter = null; try { inter = T.intersect(T.featureCollection([fg, x.g])); } catch(e){ inter = null; }
      if(!inter) return;
      const a = T.area(inter) / 10000; if(a < 0.001) return;
      hits.push({ p: x.p, a }); if(x.active) act += a; else noDoc += a;
    });
    const covered = Math.min(fieldArea, act + noDoc);
    return { f, field: fieldArea, act: Math.min(act, fieldArea), noDoc: Math.min(noDoc, Math.max(0, fieldArea - act)), uncovered: Math.max(0, fieldArea - covered), parcels: hits.sort((a,b)=>b.a-a.a) };
  }).filter(Boolean).sort((a,b) => (b.uncovered + b.noDoc) - (a.uncovered + a.noDoc));
}
async function linkParcelsByIntersection(){
  if(!landAnalysisCache) return;
  const map = {};
  landAnalysisCache.rows.forEach(r => r.parcels.forEach(x => { if(x.a >= 0.05 || x.a >= num(x.p.area) * 0.1) (map[x.p.id] ||= new Set()).add(r.f.id); }));
  let n = 0;
  for(const [pid, set] of Object.entries(map)){
    const p = byId("parcels", pid); if(!p) continue;
    const ids = [...new Set([...(p.fieldIds || []), ...set])];
    if(ids.length !== (p.fieldIds || []).length){ await save("parcels", Object.assign({}, p, { fieldIds: ids })); n++; }
  }
  toast(n ? `Оновлено прив’язку для ${n} ділянок` : "Нових збігів не знайдено");
}

/* import from Excel / CSV (Cropwise export format supported) */
let xlsxLoading = null;
function ensureXlsx(){ if(window.XLSX) return Promise.resolve(); return xlsxLoading ||= loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"); }
function normDate(v){
  if(v == null || v === "") return "";
  if(v instanceof Date && !isNaN(v)) return new Date(v.getTime() - v.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})/); if(m) return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return m[0];
  const months = {"січня":1,"лютого":2,"березня":3,"квітня":4,"травня":5,"червня":6,"липня":7,"серпня":8,"вересня":9,"жовтня":10,"листопада":11,"грудня":12};
  m = s.toLowerCase().match(/^(\d{1,2})\s+([а-яіїєґ']+)\s+(\d{4})/); if(m && months[m[2]]) return `${m[3]}-${String(months[m[2]]).padStart(2,"0")}-${m[1].padStart(2,"0")}`;
  return "";
}
const numCell = v => num(String(v ?? "").replace(/\s| /g, "").replace(/UAH|грн/gi, ""));
function pick(row, ...keys){
  const ks = Object.keys(row).map(k => [k, k.toLowerCase().replace(/[,.:]+$/, "").trim()]);
  const tests = [(kl, x) => kl === x, (kl, x) => kl.startsWith(x + " ") || kl.startsWith(x + ","), (kl, x) => x.length > 3 && kl.includes(x)];
  for(const t of tests) for(const x of keys) for(const [k, kl] of ks){ if(t(kl, x)){ const v = row[k]; if(v !== "" && v != null) return v; } }
  return "";
}
async function readTable(file){
  if(/\.xlsx?$/i.test(file.name)){
    await ensureXlsx();
    const wb = XLSX.read(await file.arrayBuffer(), { type: "array", cellDates: true });
    return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "", raw: true });
  }
  const text = (await file.text()).replace(/^﻿/, "");
  const delim = (text.split("\n")[0].match(/;/g) || []).length >= (text.split("\n")[0].match(/,/g) || []).length ? ";" : ",";
  const rows = []; let cur = [""], q = false; const lines = [];
  for(let i = 0; i < text.length; i++){ const c = text[i];
    if(q){ if(c === '"' && text[i+1] === '"'){ cur[cur.length-1] += '"'; i++; } else if(c === '"') q = false; else cur[cur.length-1] += c; }
    else if(c === '"') q = true; else if(c === delim) cur.push(""); else if(c === "\n"){ lines.push(cur); cur = [""]; } else if(c !== "\r") cur[cur.length-1] += c; }
  if(cur.length > 1 || cur[0]) lines.push(cur);
  const head = lines.shift() || [];
  lines.forEach(l => { if(l.every(x => !x.trim())) return; const o = {}; head.forEach((h, i) => o[h.trim()] = (l[i] ?? "").trim()); rows.push(o); });
  return rows;
}
async function findOrCreateOwner(name, code, cache){
  name = String(name || "").trim(); code = String(code || "").trim(); if(!name && !code) return "";
  const key = (code || name).toLowerCase(); if(cache[key]) return cache[key];
  let o = S.owners.find(x => (code && x.code === code) || (!code && x.name.toLowerCase() === name.toLowerCase()));
  if(!o){ const id = await save("owners", { name: name || code, code, kind: /тов|пп|фг|ат|прат|сфг|кооператив|"|«/i.test(name) ? "Юридична особа" : "Фізична особа" }); cache[key] = id; return id; }
  cache[key] = o.id; return o.id;
}

/* stock engine: chronological replay of posted documents, weighted average cost */
function stockReplay(until){
  const st = {}; const key = (w, p) => w + "|" + p;
  const get = (w, p) => st[key(w, p)] ||= { w, p, qty: 0, value: 0 };
  const avg = x => x.qty > 0 ? x.value / x.qty : 0;
  const moves = [];
  const docs = [...S.whdocs, ...fuelDocs()].filter(d => d.status === "posted" && (!until || (d.date || "") <= until)).sort((a,b) => ((a.date||"") + (a.createdAt||"")).localeCompare((b.date||"") + (b.createdAt||"")));
  for(const d of docs){
    const lines = d.lines || [];
    if(d.kind === "receipt") lines.forEach(l => { const x = get(d.to, l.productId); x.qty += num(l.qty); x.value += lineSum(l); moves.push({ d, l, w: d.to, p: l.productId, qty: num(l.qty), value: lineSum(l) }); });
    if(d.kind === "issue") lines.forEach(l => { const x = get(d.from, l.productId); const c = avg(x) * num(l.qty); x.qty -= num(l.qty); x.value -= c; moves.push({ d, l, w: d.from, p: l.productId, qty: -num(l.qty), value: -c }); });
    if(d.kind === "transfer") lines.forEach(l => { const a = get(d.from, l.productId), b = get(d.to, l.productId); const c = avg(a) * num(l.qty); a.qty -= num(l.qty); a.value -= c; b.qty += num(l.qty); b.value += c; moves.push({ d, l, w: d.from, p: l.productId, qty: -num(l.qty), value: -c }, { d, l, w: d.to, p: l.productId, qty: num(l.qty), value: c }); });
    if(d.kind === "inventory") lines.forEach(l => { const x = get(d.to, l.productId); const diff = num(l.fact) - x.qty; const c = (avg(x) || num(l.price)) * diff; x.qty += diff; x.value += c; if(Math.abs(diff) > 1e-9) moves.push({ d, l, w: d.to, p: l.productId, qty: diff, value: c }); });
    if(d.kind === "production"){
      let cost = 0;
      (d.inputs || []).forEach(l => { const x = get(d.from, l.productId); const c = avg(x) * num(l.qty); cost += c; x.qty -= num(l.qty); x.value -= c; moves.push({ d, l, w: d.from, p: l.productId, qty: -num(l.qty), value: -c }); });
      const outQty = sum(lines, l => l.qty);
      lines.forEach(l => { const x = get(d.to, l.productId); const v = num(l.price) ? lineSum(l) : (outQty ? cost * num(l.qty) / outQty : 0); x.qty += num(l.qty); x.value += v; moves.push({ d, l, w: d.to, p: l.productId, qty: num(l.qty), value: v }); });
    }
  }
  return { st, moves, avg };
}

function bindLines(m, sel, mode, getWh){
  const box = m.querySelector(sel);
  const refresh = () => { box.querySelectorAll(".wl").forEach(r => { const pid = r.querySelector(".lP").value;
    if(mode === "inv"){ const w = getWh && getWh(); r.querySelector(".lBook").textContent = pid && w ? "облік: " + fmt(stockOf(w, pid, val(m, "wDate") || today()), 3) + " " + prodUnit(pid) : "облік: —"; }
    else { const s = r.querySelector(".lS"); if(s){ const q = num(r.querySelector(".lQ").value), p = num(r.querySelector(".lPr").value); s.textContent = q && p ? fmt(q * p) : (pid ? prodUnit(pid) : ""); } } }); };
  box.addEventListener("click", e => { if(e.target.classList.contains("lX")){ e.target.closest(".wl").remove(); refresh(); } });
  box.addEventListener("change", e => { if(e.target.classList.contains("lP")){ const r = e.target.closest(".wl"); const pr = r.querySelector(".lPr"); if(pr && !pr.value){ const p = byId("products", e.target.value); const pl = latestPrice(e.target.value); if(pl) pr.value = pl; else if(p && p.price) pr.value = p.price; } } refresh(); });
  box.addEventListener("input", refresh);
  return refresh;
}
function latestPrice(pid){ const pls = [...S.pricelists].filter(x => !x.archived).sort((a,b) => (b.date||"").localeCompare(a.date||"")); for(const pl of pls){ const l = (pl.lines || []).find(x => x.productId === pid); if(l && num(l.price)) return num(l.price); } return 0; }
function whDocDialog(d, preset){
  const isNew = !d; const kind = (d && d.kind) || (preset && preset.kind) || "receipt"; const K = DOC_KINDS[kind];
  const mainWh = (sorted("warehouses")[0] || {}).id || "";
  d = d || Object.assign({ kind, date: today(), status: "draft", number: nextNumber(kind), lines: [], inputs: [], from: K.from ? mainWh : "", to: K.to ? mainWh : "" }, preset || {});
  const locked = d.status === "posted";
  const mode = K.inv ? "inv" : "";
  const m = openModal({ title: (isNew ? "Новий: " : "") + K.one + (d.number ? " " + d.number : ""), wide: true,
    body: `${locked ? `<div class="banner">Документ проведено. Щоб змінити — спершу скасуйте проведення.</div>` : ""}<div class="f">
      <label>Номер<input id="wNum" value="${esc(d.number||"")}"></label>
      <label>Дата<input id="wDate" type="date" value="${esc(d.date||"")}"></label>
      ${K.cp ? `<label>Контрагент (постачальник)<select id="wCp">${cpOptions(d.counterpartyId)}</select></label><label>Вхідний рахунок<select id="wInv">${opt("", "—", d.invoiceId)}${S.invoices.map(i => opt(i.id, (i.number||"") + " · " + (cpName(i.counterpartyId)||""), d.invoiceId)).join("")}</select></label>` : ""}
      ${K.from ? `<label>${K.prod ? "Сировина зі складу" : "Зі складу"}<select id="wFrom">${opt("", "—", d.from)}${sorted("warehouses").map(w => opt(w.id, w.name, d.from)).join("")}</select></label>` : ""}
      ${K.to ? `<label>${K.inv ? "Склад" : K.prod ? "Продукцію на склад" : "На склад"}<select id="wTo">${opt("", "—", d.to)}${sorted("warehouses").map(w => opt(w.id, w.name, d.to)).join("")}</select></label>` : ""}
      ${K.target ? `<label>Агрооперація<select id="wOp">${opt("", "—", d.opId)}${S.ops.filter(o => Number(o.season) === state.season || o.id === d.opId).sort((a,b)=>Number(b.number||0)-Number(a.number||0)).map(o => opt(o.id, "№" + o.number + " " + opTitle(o) + " · " + ((byId("fields", o.fieldId)||{}).name||""), d.opId)).join("")}</select></label>
        <label>Поле<select id="wField">${opt("", "—", d.fieldId)}${[...S.fields].sort((a,b)=>a.name.localeCompare(b.name,"uk",{numeric:true})).map(f => opt(f.id, f.name, d.fieldId)).join("")}</select></label>
        <label>Машина<select id="wMach">${optsFrom(sorted("machines"), d.machineId, "—")}</select></label>
        <label>Призначення / отримувач<input id="wPurp" value="${esc(d.purpose||"")}" placeholder="напр. ремонт, господарські потреби"></label>` : ""}
      <label>Відповідальний<input id="wResp" value="${esc(d.responsible||"")}"></label>
      <label class="full">Додаткова інформація<textarea id="wNote">${esc(d.note||"")}</textarea></label>
    </div>
    ${K.prod ? `<div><b>Сировина (списується)</b><div class="apps" id="wIn" style="margin-top:6px">${(d.inputs||[]).map(l => lineRow(l)).join("")}</div><button class="btn sm" type="button" id="wAddIn" style="margin-top:6px">+ Рядок</button></div>` : ""}
    <div><b>${K.prod ? "Продукція (оприбутковується)" : K.inv ? "Фактичні залишки" : "Номенклатура"}</b><div class="apps" id="wLines" style="margin-top:6px">${(d.lines||[]).map(l => lineRow(l, mode)).join("")}</div><button class="btn sm" type="button" id="wAdd" style="margin-top:6px">+ Рядок</button>${K.inv ? ` <button class="btn sm" type="button" id="wFillInv">Заповнити всіма залишками складу</button>` : ""}</div>
    <div class="note" id="wTot"></div>`,
    extra: (locked ? `<button class="btn" type="button" id="wUnpost">Скасувати проведення</button>` : `<button class="btn" type="button" id="wPost">Зберегти і провести</button>`),
    onDelete: isNew ? null : async () => remove("whdocs", d.id),
    onSave: async (m) => saveWhDoc(m, d, K, mode, d.status)
  });
  const refresh = bindLines(m, "#wLines", mode, () => val(m, K.inv ? "wTo" : "wFrom"));
  if(K.prod) bindLines(m, "#wIn", "", () => val(m, "wFrom"));
  const tot = () => { const ls = readLines(m.querySelector("#wLines"), mode); m.querySelector("#wTot").textContent = mode === "inv" ? `Рядків: ${ls.length}` : `Рядків: ${ls.length} · сума ${fmt(sum(ls, lineSum))} грн`; };
  m.addEventListener("input", tot); m.addEventListener("change", tot); tot(); refresh();
  m.querySelector("#wAdd").onclick = () => { m.querySelector("#wLines").insertAdjacentHTML("beforeend", lineRow({}, mode)); };
  if(K.prod) m.querySelector("#wAddIn").onclick = () => { m.querySelector("#wIn").insertAdjacentHTML("beforeend", lineRow({})); };
  if(K.inv) m.querySelector("#wFillInv").onclick = () => { const w = val(m, "wTo"); if(!w){ toast("Оберіть склад"); return; } const { st, avg } = stockReplay(val(m, "wDate") || today()); const have = new Set(readLines(m.querySelector("#wLines"), mode).map(l => l.productId));
    Object.values(st).filter(x => x.w === w && Math.abs(x.qty) > 1e-9 && !have.has(x.p)).forEach(x => m.querySelector("#wLines").insertAdjacentHTML("beforeend", lineRow({ productId: x.p, fact: +x.qty.toFixed(3), price: +avg(x).toFixed(2) }, mode))); refresh(); };
  if(K.cp){ m.querySelector("#wInv").addEventListener("change", e => { const inv = byId("invoices", e.target.value); if(!inv) return; if(!val(m, "wCp")) m.querySelector("#wCp").value = inv.counterpartyId || "";
    if(!readLines(m.querySelector("#wLines"), mode).length){ (inv.lines || []).forEach(l => m.querySelector("#wLines").insertAdjacentHTML("beforeend", lineRow(l))); tot(); } }); }
  const post = m.querySelector("#wPost"); if(post) post.onclick = async () => { if(await saveWhDoc(m, d, K, mode, "posted")) closeModal(); };
  const unpost = m.querySelector("#wUnpost"); if(unpost) unpost.onclick = async () => { await save("whdocs", Object.assign({}, d, { status: "draft" })); closeModal(); toast("Проведення скасовано"); };
  if(locked) m.querySelectorAll("#mForm input, #mForm select, #mForm textarea, #mForm button").forEach(x => x.disabled = true);
}
async function saveWhDoc(m, d, K, mode, status){
  if(d.status === "posted" && status === "posted" && m.querySelector("#wNum").disabled) return true;
  const o = Object.assign({}, d, { number: val(m,"wNum"), date: val(m,"wDate"), responsible: val(m,"wResp"), note: val(m,"wNote"), lines: readLines(m.querySelector("#wLines"), mode), status });
  if(K.cp){ o.counterpartyId = val(m,"wCp"); o.invoiceId = val(m,"wInv"); }
  if(K.from) o.from = val(m,"wFrom"); if(K.to) o.to = val(m,"wTo");
  if(K.target){ o.opId = val(m,"wOp"); o.fieldId = val(m,"wField"); o.machineId = val(m,"wMach"); o.purpose = val(m,"wPurp"); if(o.opId && !o.fieldId){ const op = byId("ops", o.opId); if(op) o.fieldId = op.fieldId; } }
  if(K.prod) o.inputs = readLines(m.querySelector("#wIn"), "");
  if(!o.lines.length){ toast("Додайте хоча б один рядок"); return false; }
  if((K.from && !o.from) || (K.to && !o.to)){ toast("Оберіть склад"); return false; }
  if(o.kind === "transfer" && o.from === o.to){ toast("Склади мають відрізнятися"); return false; }
  if(status === "posted" && (o.kind === "issue" || o.kind === "transfer" || o.kind === "production")){
    const src = o.from; const need = o.kind === "production" ? o.inputs : o.lines; const short = [];
    const { st } = stockReplay(o.date);
    need.forEach(l => { const have = (st[src + "|" + l.productId] || {}).qty || 0; if(num(l.qty) > have + 1e-9) short.push(`${prodName(l.productId)}: є ${fmt(have,3)}, потрібно ${fmt(num(l.qty),3)}`); });
    if(short.length) toast("Увага, не вистачає залишку: " + short.join("; "));
  }
  return !!(await save("whdocs", o));
}

/* ---------- machinery extras: maintenance plans, norms, fuel, harvest transport, waybills, elevators ---------- */
function machineReadings(mid){
  let km = 0, mh = 0, kmDate = "", mhDate = "";
  const take = (d, k, h) => { if(num(k) > km){ km = num(k); kmDate = d; } if(num(h) > mh){ mh = num(h); mhDate = d; } };
  S.fuelings.filter(f => f.machineId === mid).forEach(f => take(f.date, f.odometer, f.motohours));
  S.service.filter(s => s.machineId === mid && s.status === "done").forEach(s => take(s.date, s.km, s.mh));
  const x = byId("machines", mid) || {}; take(x.readingDate || "", x.odometer, x.motohours);
  return { km, mh, kmDate, mhDate };
}
function planApplies(p, x){ return (p.machineIds || []).length ? p.machineIds.includes(x.id) : (!p.subtype || p.subtype === x.subtype) && (!p.type || p.type === (x.type || "Агро")); }
function planDue(p, x){
  const last = S.service.filter(s => s.machineId === x.id && s.status === "done" && (s.planId === p.id || s.kind === p.name)).sort((a,b) => (b.date||"").localeCompare(a.date||""))[0];
  const r = machineReadings(x.id); const res = { last, r, reasons: [], state: "ok" };
  if(!last){ res.state = "unknown"; res.reasons.push("внесіть останнє виконане ТО"); return res; }
  const lastKm = last ? num(last.km) : 0, lastMh = last ? num(last.mh) : 0, lastDate = last ? last.date : (x.inServiceDate || "");
  if(num(p.everyKm)){ res.nextKm = lastKm + num(p.everyKm); const left = res.nextKm - r.km; res.reasons.push(`${fmt0(left)} км`); if(left <= 0) res.state = "late"; else if(left <= num(p.everyKm) * 0.1 && res.state !== "late") res.state = "soon"; }
  if(num(p.everyMh)){ res.nextMh = lastMh + num(p.everyMh); const left = res.nextMh - r.mh; res.reasons.push(`${fmt0(left)} мотогод.`); if(left <= 0) res.state = "late"; else if(left <= num(p.everyMh) * 0.1 && res.state !== "late") res.state = "soon"; }
  if(num(p.everyDays) && lastDate){ const d = new Date(lastDate); d.setDate(d.getDate() + num(p.everyDays)); res.nextDate = d.toISOString().slice(0,10); const left = Math.round((d - new Date(today())) / 864e5); res.reasons.push(`${left} дн.`); if(left <= 0) res.state = "late"; else if(left <= Math.max(7, num(p.everyDays) * 0.1) && res.state !== "late") res.state = "soon"; }
  return res;
}
function maintenanceDue(){
  const out = [];
  S.mplans.filter(p => !p.archived).forEach(p => S.machines.filter(x => planApplies(p, x)).forEach(x => out.push({ p, x, d: planDue(p, x) })));
  const rank = { late: 0, soon: 1, unknown: 2, ok: 3 };
  return out.sort((a,b) => rank[a.d.state] - rank[b.d.state]);
}

/* consumption norms */
function normFor(machineId, workType){
  const x = byId("machines", machineId) || {};
  const c = S.norms.filter(n => (!n.machineId || n.machineId === machineId) && (!n.subtype || n.subtype === x.subtype) && (!n.workType || n.workType === workType));
  c.sort((a,b) => (!!b.machineId - !!a.machineId) || (!!b.workType - !!a.workType));
  return c[0] || (x.normHa || x.normKm ? { normHa: x.normHa, normKm: x.normKm } : null);
}

      <p class="note">л/100 км і л/мотогод. рахуються між першою й останньою заправкою з показниками за період. Відхилення порівнює пальне із завдань (або видане) з нормою за видами робіт.</p>` : `<div class="card"><div class="empty">Даних про пальне за період немає.</div></div>`);
  }
  if(T === "stations"){
    const { st } = stockReplay("");
    const list = sorted("fuelstations");
    body = `<div class="filters"><span class="note">АЗС прив’язана до складу: видача палива списує його з залишків складу.</span><span style="flex:1"></span><button class="btn pri" type="button" data-act="newStation">+ АЗС</button></div>
    <div class="tw"><table><thead><tr><th>АЗС</th><th>Тип</th><th>Склад</th><th>Пальне</th><th class="n">Ємність, л</th><th class="n">Залишок, л</th><th>Відповідальний</th></tr></thead><tbody>
    ${list.length ? list.map(s => { const rest = s.warehouseId && s.productId ? ((st[s.warehouseId + "|" + s.productId] || {}).qty || 0) : null; const low = rest != null && num(s.capacity) && rest < num(s.capacity) * 0.15;

  }
  if(T === "norms") body = viewNorms();
  return header("Паливо", `<button class="btn pri" type="button" data-act="newFueling">+ Видача палива</button>`) + statusBanner() + `<div class="tabs">${tabs.map(([k,l]) => `<button type="button" class="${T===k?"on":""}" data-fueltab="${k}">${esc(l)}</button>`).join("")}</div>` + body;

/* weather (Open-Meteo through the worker) */
const weatherCache = {};
function wmo(code){ const c = Number(code); if(c === 0) return "Ясно"; if(c <= 2) return "Мінлива хмарність"; if(c === 3) return "Хмарно"; if(c <= 48) return "Туман"; if(c <= 57) return "Мряка"; if(c <= 67) return "Дощ"; if(c <= 77) return "Сніг"; if(c <= 82) return "Злива"; if(c <= 86) return "Снігопад"; return "Гроза"; }
async function loadWeather(f){
  const c = fieldCenter(f); if(!c) return null;
  const key = c.map(v => v.toFixed(2)).join(",") + "|" + (fieldSeason(f).sowDate || "");
  if(weatherCache[key] && Date.now() - weatherCache[key].t < 3600e3) return weatherCache[key].d;
  const sow = fieldSeason(f).sowDate || "";
  const d = await api("/weather?lat=" + c[1].toFixed(4) + "&lon=" + c[0].toFixed(4) + (sow ? "&from=" + sow : ""));
  weatherCache[key] = { t: Date.now(), d }; return d;
}
function weatherHtml(d, f){
  if(!d || !d.forecast || !d.forecast.daily) return `<p class="note">Погода недоступна.</p>`;
  const fc = d.forecast, cur = fc.current || {}, dl = fc.daily;
  const hist = d.history && d.history.daily ? d.history.daily : null;
  let gdd5 = 0, gdd10 = 0, rainSow = 0;
  if(hist){ hist.time.forEach((t, i) => { const avg = (num(hist.temperature_2m_max[i]) + num(hist.temperature_2m_min[i])) / 2; gdd5 += Math.max(0, avg - 5); gdd10 += Math.max(0, avg - 10); rainSow += num(hist.precipitation_sum[i]); }); }
  const past = (dl.time || []).map((t, i) => [t, num(dl.precipitation_sum[i])]).filter(([t]) => t < today());
  const rain7 = sum(past.slice(-7), x => x[1]), rain30 = sum(past.slice(-30), x => x[1]);
  const fut = (dl.time || []).map((t, i) => ({ t, max: dl.temperature_2m_max[i], min: dl.temperature_2m_min[i], p: dl.precipitation_sum[i], w: dl.wind_speed_10m_max[i], c: dl.weather_code[i] })).filter(x => x.t >= today()).slice(0, 7);
  return `<div class="kpis" style="margin-bottom:10px"><div class="kpi"><b>${cur.temperature_2m != null ? fmt(cur.temperature_2m, 0) + "°" : "—"}</b><span>${esc(wmo(cur.weather_code))} · вітер ${cur.wind_speed_10m != null ? fmt(cur.wind_speed_10m / 3.6, 1) : "—"} м/с</span></div><div class="kpi"><b>${fmt(rain7, 0)} / ${fmt(rain30, 0)}</b><span>мм опадів за 7 / 30 днів</span></div>
  ${hist ? `<div class="kpi"><b>${fmt0(gdd5)}° / ${fmt0(gdd10)}°</b><span>сума ефективних температур з дати сівби (>5° / >10°)</span></div><div class="kpi"><b>${fmt0(rainSow)}</b><span>мм опадів з дати сівби</span></div>` : ""}</div>
  <div class="tw"><table><thead><tr><th>Дата</th><th>Погода</th><th class="n">Макс / мін, °C</th><th class="n">Опади, мм</th><th class="n">Вітер, м/с</th><th>Обприскування</th></tr></thead><tbody>${fut.map(x => { const wind = num(x.w) / 3.6; const ok = wind <= 5 && num(x.p) < 1 && num(x.max) <= 25;
    return `<tr><td>${fdate(x.t)}</td><td>${esc(wmo(x.c))}</td><td class="n">${fmt(x.max,0)} / ${fmt(x.min,0)}</td><td class="n">${num(x.p)?fmt(num(x.p),1):"—"}</td><td class="n">${fmt(wind,1)}</td><td><span class="pill ${ok?"st-done":"st-progress"}">${ok?"сприятливо":"обмежено"}</span></td></tr>`; }).join("")}</tbody></table></div>
  <p class="note">Дані Open-Meteo для центру поля. «Обмежено»: вітер понад 5 м/с, опади або спека понад 25 °C.</p>`;
}

    loadWeather(f).then(w => { box.innerHTML = weatherHtml(w, f); }).catch(() => { box.innerHTML = `<p class="note">Не вдалося отримати погоду. Спробуйте пізніше.</p>`; }); return true; }

const DEFAULT_REMOVAL = { "Пшениця озима": [30, 12, 25], "Пшениця яра": [35, 12, 25], "Ячмінь ярий": [25, 11, 22], "Ячмінь озимий": [25, 11, 22], "Кукурудза": [25, 11, 25], "Соняшник": [45, 20, 100], "Ріпак озимий": [50, 25, 45], "Соя": [70, 20, 35], "Горох": [60, 16, 30], "Жито озиме": [28, 12, 26] };
function removalFor(crop){ const s = (S.settings.find(x => x.id === "nutrition") || {}).removal || {}; return s[crop] || DEFAULT_REMOVAL[crop] || null; }
const REC_STATUS = { new: ["Нова","st-planned"], accepted: ["Прийнята","st-progress"], done: ["Виконана","st-done"], rejected: ["Відхилена","st-cancel"] };
const unitPrice = pid => latestPrice(pid) || num((byId("products", pid) || {}).price);
function planFields(p){ return (p.fieldIds || []).map(id => byId("fields", id)).filter(Boolean); }
function planArea(p){ return sum(planFields(p), f => f.area); }
function planCostPerHa(p){ return sum(p.items || [], it => sum(it.applications || [], a => num(a.rate) * unitPrice(a.productId)) + num(it.serviceCost)); }
function planOps(p){ return S.ops.filter(o => o.planId === p.id); }

function viewPlans(){
  const T = state.planTab || "agro";
  const tabs = [["agro","Агроплани"],["nutrition","Плани живлення"],["recs","Агрорекомендації"]];
  let body = "";
  if(T === "agro"){
    const list = S.agroplans.filter(p => Number(p.season) === state.season).sort((a,b) => (a.name||"").localeCompare(b.name||"","uk"));
    body = `<div class="filters"><span class="muted">Сезон ${seasonLabel(state.season)}</span><span style="flex:1"></span><button class="btn pri" type="button" data-act="newAgroplan">+ Агроплан</button></div>
    ${list.length ? `<div class="tw"><table><thead><tr><th>Агроплан</th><th>Культура</th><th class="n">Полів</th><th class="n">Площа, га</th><th class="n">Операцій у плані</th><th class="n">Створено агрооперацій</th><th>Прогрес</th><th class="n">Матеріали, грн/га</th><th class="n">Бюджет, грн</th><th class="n">Факт матеріалів, грн</th></tr></thead><tbody>
    ${list.map(p => { const ops = planOps(p); const plan = sum(ops, opPlanned), done = sum(ops, opDone); const pct = plan ? Math.min(100, done / plan * 100) : 0; const area = planArea(p);
      const fact = sum(ops.filter(o => o.status === "done" || opDone(o)), o => sum(o.applications || [], a => num(a.rate) * opDone(o) * unitPrice(a.productId)));
      return `<tr class="click" data-agroplan="${esc(p.id)}"><td><b>${esc(p.name)}</b><div class="note">${esc(p.note||"")}</div></td><td>${cropTag(p.crop)}</td><td class="n">${planFields(p).length}</td><td class="n">${fmt(area)}</td><td class="n">${(p.items||[]).length}</td><td class="n">${ops.length}</td><td><div class="bar" title="${fmt0(pct)}%"><i style="width:${pct}%"></i></div><div class="note">${fmt0(pct)}% · ${fmt(done)} з ${fmt(plan)} га</div></td><td class="n">${fmt(planCostPerHa(p))}</td><td class="n">${fmt0(planCostPerHa(p) * area)}</td><td class="n">${fact?fmt0(fact):"—"}</td></tr>`; }).join("")}</tbody></table></div>`
      : `<div class="card"><div class="empty"><b>Агропланів на сезон ${seasonLabel(state.season)} немає</b>Агроплан — це технологічна карта: перелік робіт і матеріалів для культури на групу полів. З нього одним кліком створюються агрооперації на кожне поле.</div></div>`}`;

const MON = ["Січ","Лют","Бер","Кві","Тра","Чер","Лип","Сер","Вер","Жов","Лис","Гру"];
function tsChart(dates, series, opt = {}){

  const mlab = ms.filter((_, i) => i % step === 0).map(d => `<text x="${x(d.toISOString().slice(0,10)).toFixed(1)}" y="${H-8}" font-size="10" fill="var(--muted)" text-anchor="middle">${d.getMonth() === 0 ? d.getFullYear() : MON[d.getMonth()]}</text>`).join("");
  const draw = s => { if(s.bars){ const bw = Math.max(1, (W - L - R) / dates.length * 0.8); return dates.map((d, i) => s.v[i] ? `<rect x="${(x(d) - bw / 2).toFixed(1)}" y="${y(s.v[i]).toFixed(1)}" width="${bw.toFixed(1)}" height="${(y(lo) - y(s.v[i])).toFixed(1)}" fill="${s.c}"/>` : "").join(""); }

async function readBackupFile(file){
  let buf = await file.arrayBuffer(); const u = new Uint8Array(buf);
  if(u[0] === 0x1f && u[1] === 0x8b) buf = await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer();
  return new TextDecoder().decode(buf);
}
function restoreDialog(text, label){
  openModal({ title: "Відновлення з резервної копії", saveLabel: "Відновити",
    body: `${text ? `<p>Джерело: <b>${esc(label)}</b></p>` : `<div class="f"><label class="full">Файл копії (.json або .json.gz)<input type="file" id="rsF" accept=".json,.gz,application/json,application/gzip"></label></div>`}

    onSave: async (m) => {

      m.querySelector("#rsE").textContent = "Відновлюю…";
      const r = await fetch("/api/import?mode=" + val(m, "rsM"), { method: "POST", headers: { "content-type": "application/json" }, body: t });
      const j = await r.json().catch(() => ({}));

      toast(`Відновлено записів: ${j.restored}${j.removed ? ", прибрано: " + j.removed : ""}`); BACKUPS = null; await initDb();
    }
  });
}
async function backupAction(a, d){

const aoNorm = s => String(s || "").split(" · ")[0].toLowerCase().replace(/[’'`ʼ]/g, "'").replace(/\s+/g, " ").trim();
function aoKeys(f){ const ks = new Set([aoNorm(f.name)]); String(f.aoNames || "").split(/[,;\n]/).map(aoNorm).filter(Boolean).forEach(k => ks.add(k)); return ks; }

function aoFieldData(f){

/* ---------- economics: field & crop cost and margin ---------- */
const COST_CATS = ["Послуги сторонніх організацій","Зарплата","Техніка (власна)","Амортизація","Страхування","Податки і збори","Сушка і доробка","Зберігання","Логістика","Інше"];
function econSettings(){ return S.settings.find(x => x.id === "econ") || { id: "econ", prices: {}, fuelPrice: "" }; }
function cropPrice(crop, season){ const p = (econSettings().prices || {})[season] || {}; return num(p[crop]); }
function fuelPriceDefault(){ const s = econSettings(); if(num(s.fuelPrice)) return num(s.fuelPrice); const f = S.products.find(p => p.type === "Паливо"); return f ? unitPrice(f.id) : 0; }
function seasonOf(date){ return Number((date || "").slice(0, 4)); }
function computeEconomics(season){
  const fields = S.fields.filter(f => !f.archived && (fieldCrop(f, season) || S.ops.some(o => o.fieldId === f.id && Number(o.season) === season)));

  const aoF = new Set();

  aoCostsFor(season).forEach(({ f, c }) => { if(!R[f.id]) return; aoF.add(f.id); R[f.id].ao = c;
    Object.entries(c.cats || {}).forEach(([cat, v]) => { v = num(v); if(!v) return; add(f.id, AO_CAT_KEY[cat] || "direct", v, { what: cat, src: "АгроОблік · " + (c.field || ""), ao: true }); }); });

  const { moves } = stockReplay("");
  const opsWithIssue = new Set();
  moves.filter(mv => mv.d.kind === "issue" && mv.value).forEach(mv => {
    const op = byId("ops", mv.d.opId); const fid = mv.d.fieldId || (op && op.fieldId); if(!fid) return;

    const p = byId("products", mv.p) || {};
    add(fid, p.type === "Паливо" ? "fuel" : "materials", -mv.value, { what: (p.name || "?") + " " + fmt(-mv.qty, 2) + " " + (p.unit || ""), src: "склад · " + (mv.d.number || "") + " " + fdate(mv.d.date) });
  });
  // 2. materials planned in operations that were done but not issued from the warehouse (estimate)

  const totalArea = sum(Object.values(R), r => r.area) || 1;

    let targets = [];

      const r = await fetch("/api/files?col=" + col + "&id=" + encodeURIComponent(id) + "&name=" + encodeURIComponent(f.name), { method: "POST", headers: { "content-type": f.type || "application/octet-stream" }, body: f });
      if(!r.ok) toast("Не вдалося завантажити " + f.name); } load(); };
  input.onchange = () => upload([...input.files]);
  drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("over"));
  drop.addEventListener("drop", e => { e.preventDefault(); drop.classList.remove("over"); upload([...e.dataTransfer.files]); });
