<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>КЛГ Агро Поле</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
/* Layout: fixed left rail of modules, working area on the right; tables and map are the main surfaces. */
:root{
  --paper:#f3f5f1; --surface:#ffffff; --ink:#1c2420; --muted:#5f6b63; --line:#dde3da;
  --accent:#2f6b4c; --accent-soft:#e3efe7; --accent-ink:#ffffff;
  --wheat:#b9852a; --good:#2e7d4f; --warn:#b7791f; --bad:#b4413a; --info:#3a6ea5;
  --rail:#18211c; --rail-ink:#c9d4cc; --rail-active:#2f6b4c;
  --font:"Golos Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:8px; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121714; --surface:#1a211d; --ink:#e4ebe6; --muted:#97a59c; --line:#2c3630;
    --accent:#5fae84; --accent-soft:#213229; --accent-ink:#0f1512;
    --wheat:#d9a54a; --good:#5fbf86; --warn:#e0a84a; --bad:#e2766e; --info:#7aa7d6;
    --rail:#0c110e; --rail-ink:#b3c1b8; --rail-active:#2f6b4c; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121714; --surface:#1a211d; --ink:#e4ebe6; --muted:#97a59c; --line:#2c3630;
  --accent:#5fae84; --accent-soft:#213229; --accent-ink:#0f1512;
  --wheat:#d9a54a; --good:#5fbf86; --warn:#e0a84a; --bad:#e2766e; --info:#7aa7d6;
  --rail:#0c110e; --rail-ink:#b3c1b8; --rail-active:#2f6b4c; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100%}
.rail{background:var(--rail);color:var(--rail-ink);padding:16px 10px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;color:#fff;font-weight:700;font-size:16px}
.brand svg{flex:none}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--rail-ink);opacity:.8}
.rail a{display:flex;align-items:center;gap:10px;color:var(--rail-ink);text-decoration:none;padding:8px 10px;border-radius:6px;font-weight:500}
.rail a:hover{background:rgba(255,255,255,.06)}
.rail a.on{background:var(--rail-active);color:#fff}
.rail .sec{font-size:11px;text-transform:uppercase;letter-spacing:.06em;opacity:.55;padding:12px 10px 4px}
.rail .season{margin-top:auto;padding:10px;border-top:1px solid rgba(255,255,255,.08);display:grid;gap:6px;font-size:12px}
.rail .season select{background:#243029;border:1px solid #33433a;color:#fff;border-radius:6px;padding:6px}
main{padding:20px 24px 60px;min-width:0}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.top h1{font-size:22px;margin:0;text-wrap:balance;font-weight:700}
.top .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{padding:4px 8px;font-size:12px}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h2{font-size:15px;margin:0 0 12px;font-weight:600}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums;font-weight:700}
.kpi span{color:var(--muted);font-size:12px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;background:color-mix(in srgb,var(--paper) 60%,var(--surface));position:sticky;top:0;white-space:nowrap}
td.n,th.n{text-align:right;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--accent-soft)}
tr.grp td{background:color-mix(in srgb,var(--paper) 70%,var(--surface));font-weight:600}
tr.sub td{font-weight:600;color:var(--muted);background:color-mix(in srgb,var(--paper) 35%,var(--surface))}
tr:last-child td{border-bottom:0}
.muted{color:var(--muted)}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.st-planned{background:color-mix(in srgb,var(--info) 14%,transparent);color:var(--info)}
.st-progress{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.st-done{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.st-cancel{background:color-mix(in srgb,var(--muted) 16%,transparent);color:var(--muted)}
.crop{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none;border:1px solid rgba(0,0,0,.15)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.filters input,.filters select,.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 9px;min-width:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:6px}
.map{position:relative;background:color-mix(in srgb,var(--paper) 50%,var(--surface));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;height:440px;touch-action:none}
.map svg{width:100%;height:100%;display:block;cursor:grab}
.map svg.drag{cursor:grabbing}
.map path{stroke:color-mix(in srgb,var(--ink) 55%,transparent);stroke-width:1;vector-effect:non-scaling-stroke;fill-opacity:.82;cursor:pointer}
.map path:hover{fill-opacity:1;stroke:var(--ink);stroke-width:2}
.map path.sel{stroke:var(--bad);stroke-width:3}
.map text{fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round;pointer-events:none;font-weight:600}
.map .ctl{position:absolute;top:10px;left:10px;display:flex;flex-direction:column;gap:4px}
.map .ctl button{width:32px;height:32px;border:1px solid var(--line);background:var(--surface);border-radius:6px;cursor:pointer;font-size:16px;font-weight:600}
.map .scale{position:absolute;left:10px;bottom:10px;font-size:11px;color:var(--muted);background:var(--surface);padding:2px 6px;border-radius:4px;border:1px solid var(--line)}
.map .tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);padding:6px 8px;border-radius:6px;font-size:12px;display:none;max-width:240px;z-index:2}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px}
.overlay{position:fixed;inset:0;background:rgba(10,15,12,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:20}
.modal{background:var(--surface);border-radius:10px;border:1px solid var(--line);width:min(720px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.wide{width:min(980px,100%)}
.modal header{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);gap:10px}
.modal header h3{margin:0;font-size:16px;flex:1}
.modal .body{padding:16px 18px;display:grid;gap:14px}
.modal footer{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.modal footer .sp{flex:1}
.f{display:grid;gap:10px 14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.f label{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
.f label.full{grid-column:1/-1}
.f textarea{min-height:60px;resize:vertical}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:4px 10px;max-height:150px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:8px}
.checks label{display:flex;gap:6px;align-items:center;color:var(--ink);font-size:13px}
.apps{display:grid;gap:6px}
.approw{display:grid;grid-template-columns:2fr 1fr 90px 32px;gap:6px;align-items:center}
.approw input,.approw select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 8px;min-width:0}
.note{font-size:12px;color:var(--muted)}
.banner{background:color-mix(in srgb,var(--wheat) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--wheat) 40%,var(--line));border-radius:var(--r);padding:10px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.err{background:color-mix(in srgb,var(--bad) 10%,var(--surface));border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.toast{position:fixed;right:16px;bottom:16px;background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:8px;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.rot td{min-width:110px}
.chip{display:inline-flex;gap:6px;align-items:center;padding:3px 8px;border-radius:5px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:var(--surface)}
.chip.none{color:var(--muted);font-weight:400;border-style:dashed}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.dl dt{color:var(--muted)}
.dl dd{margin:0;font-variant-numeric:tabular-nums}
.menu-btn{display:none}
.mapbox{position:relative;height:480px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#1d2a22}
.mapgl{position:absolute;inset:0}
.mtools{position:absolute;top:10px;left:10px;display:flex;gap:4px;z-index:2;flex-wrap:wrap}
.mtools button,.drawbar button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:5px 10px;cursor:pointer;font-weight:600;font-size:12px}
.mtools button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.drawbar{position:absolute;left:10px;right:10px;bottom:34px;z-index:3;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.drawbar[hidden]{display:none}
.drawbar span{flex:1;min-width:160px;font-size:12px}
.drawbar button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.maplibregl-popup-content{font-family:var(--font);font-size:12px;color:#1c2420;padding:8px 10px}
.mapnote{position:absolute;top:50px;left:10px;z-index:2;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:12px;max-width:280px}
.filedrop{border:1.5px dashed var(--line);border-radius:8px;padding:14px;text-align:center;color:var(--muted);margin:6px 0}
.filedrop.over{border-color:var(--accent);background:var(--accent-soft)}
.linkish{color:var(--accent);cursor:pointer;text-decoration:underline}
.filerow{display:flex;gap:10px;align-items:center;padding:4px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.filerow a:first-child{flex:1;min-width:160px;color:var(--ink)}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;inset:0 auto 0 0;width:240px;z-index:15;transform:translateX(-100%);transition:transform .2s}
  .rail.open{transform:none}
  .menu-btn{display:inline-flex}
  main{padding:14px 16px 60px}
  .g2,.g3{grid-template-columns:1fr}
  .map{height:340px} .mapbox{height:380px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" id="rail" aria-label="Розділи">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="6" fill="#2f6b4c"/><path d="M5 20 L11 9 L15 15 L18 11 L23 20 Z" fill="#b9852a"/><path d="M5 20h18" stroke="#fff" stroke-width="2"/></svg>
      <div>КЛГ Агро<small>Поле і техніка</small></div>
    </div>
    <a href="#dash" data-v="dash">Центр моніторингу</a>
    <div class="sec">Агро</div>
    <a href="#fields" data-v="fields">Поля і карта</a>
    <a href="#rotation" data-v="rotation">Сівозміна</a>
    <a href="#ops" data-v="ops">Агрооперації</a>
    <a href="#scout" data-v="scout">Огляди полів</a>
    <div class="sec">Техніка</div>
    <a href="#machines" data-v="machines">Машини</a>
    <a href="#tasks" data-v="tasks">Завдання техніки</a>
    <a href="#service" data-v="service">Обслуговування</a>
    <a href="#fuel" data-v="fuel">Паливо</a>
    <a href="#harvest" data-v="harvest">Перевезення врожаю</a>
    <div class="sec">Інше</div>
    <a href="#land" data-v="land">Земельний банк</a>
    <a href="#wms" data-v="wms">Склад</a>
    <a href="#refs" data-v="refs">Довідники</a>
    <a href="#reports" data-v="reports">Звіти</a>
    <div class="season">
      <label for="seasonSel">Сезон</label>
      <select id="seasonSel"></select>
      <button class="btn sm" type="button" id="logoutBtn" style="background:transparent;color:var(--rail-ink);border-color:#33433a;margin-top:6px">Вийти</button>
    </div>
  </nav>
  <main id="main"></main>
</div>
<div id="modalRoot"></div>
<script>
"use strict";
/* ---------- constants ---------- */
const CROPS = {
  "Кукурудза":"#3b6fd8","Соняшник":"#e6d92e","Ріпак озимий":"#d38498","Пшениця озима":"#3aa05a",
  "Пшениця яра":"#7cc489","Ячмінь озимий":"#c9a227","Ячмінь ярий":"#dcc062","Соя":"#8c6bb1","Горох":"#9ad06b",
  "Жито озиме":"#b48a5a","Овес":"#cfb88a","Гречка":"#a0522d","Еспарцет":"#6fbfa0","Люцерна":"#4f9d8a",
  "Гірчиця":"#f0b429","Пар":"#c8c8c8","Не вказана":"#e0e0e0"
};
const WORKS = {
  "Обробка ґрунту":["Дискування","Дискування 2-й слід","Оранка","Оранка городів пайщикам","Культивація","Боронування","Коткування","Закриття вологи","Мульчування","Подрібнення","Глибоке розпушування","Розгортання валків соломи"],
  "Внесення":["Посів","Пересів","Обприскування","Розкидання","Внесення КАСу","Внесення аміаку"],
  "Збір врожаю":["Збір врожаю"],
  "Інше":["Тюкування","Перевезення","Інше"]
};
const GROUP_COLOR = {"Обробка ґрунту":"#b9852a","Внесення":"#3a6ea5","Збір врожаю":"#2e7d4f","Інше":"#7a7a7a"};
const STATUS = {planned:"Заплановано",progress:"В процесі",done:"Виконано",cancel:"Скасовано"};
const PRODUCT_TYPES = ["ЗЗР","Насіння","Добрива","Паливо","Запчастини","Витратний матеріал","Інше"];
const UNITS = ["л","кг","т","шт","п.о."];
const MACHINE_TYPES = {"Агро":["Трактор","Комбайн","Обприскувач","Сівалка","Навантажувач","Інше"],"Транспорт":["Вантажівка","Тягач","Самоскид","Бензовоз","Легкова","Інше"]};
const SERVICE_KINDS = ["ТО-1","ТО-2","Сезонне ТО","Заміна мастила в двигуні","Заміна фільтрів","Ремонт","Шини","Інше"];
const PEOPLE_ROLES = ["Водій","Механізатор","Агроном","Механік","Керівник","Інше"];
const COLS = ["fields","ops","machines","implements","people","products","tasks","service","parcels","leases","owners","payments","settings","warehouses","whdocs","invoices","whrequests","pricelists","units","mplans","norms","fuelstations","fuelings","harvests","waybills","elevators","scoutreports","scouttasks","notes","plantthreats"];

/* ---------- state ---------- */
const S = {}; COLS.forEach(c => S[c] = []);
const loaded = new Set();
let db = null, canWrite = true, dbState = "loading", downloads = null;
function lsGet(k){ try { return localStorage.getItem("klg_"+k); } catch(e){ return null; } }
function lsSet(k,v){ try { localStorage.setItem("klg_"+k, v); } catch(e){} }
function curSeason(){ return new Date().getFullYear(); }
const today = () => new Date().toISOString().slice(0,10);
const state = {
  view: "dash",
  season: Number(lsGet("season")) || curSeason(),
  fieldSel: null, fieldQ: "", fieldGroup: "",
  ops: { status:"", group:"", q:"" },
  period: { from: new Date().getFullYear()+"-01-01", to: today() },
  machineId: null, machQ: "",
  refTab: "products", repTab: "machines",
  landTab: "overview", landQ: "", landCouncil: "", landStatus: "", rentYear: new Date().getFullYear(), parcelSel: null,
  wmsTab: "stock", wmsQ: "", whSel: "", stockDate: "", itemCat: "", itemArch: false, wmsRep: "turnover", svcTab: "book", fuelTab: "fuelings", fuelSt: "", harvTab: "trips", scoutTab: "reports",
  mapVB: {}
};

/* ---------- helpers ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n = parseFloat(String(v ?? "").replace(",", ".")); return isFinite(n) ? n : 0; };
const fmt = (v, d=2) => (v==null || v==="" || !isFinite(v)) ? "—" : Number(v).toLocaleString("uk-UA",{minimumFractionDigits:d,maximumFractionDigits:d});
const fmt0 = v => fmt(v,0);
const fdate = s => { if(!s) return "—"; const [y,m,d]=s.split("-"); return d+"."+m+"."+y.slice(2); };
const sum = (a, f) => a.reduce((t,x)=>t+num(f(x)),0);
const byId = (col, id) => S[col].find(x => x.id === id);
const cropColor = c => CROPS[c] || hashColor(c || "");
function hashColor(s){ let h=0; for(const ch of s) h=(h*31+ch.charCodeAt(0))%360; return s ? `hsl(${h}, 45%, 60%)` : "#e0e0e0"; }
const fieldSeason = (f, s=state.season) => (f.seasons && f.seasons[s]) || {};
const fieldCrop = (f, s) => fieldSeason(f, s).crop || "";
const cropTag = c => c ? `<span class="crop"><i class="dot" style="background:${esc(cropColor(c))}"></i>${esc(c)}</span>` : `<span class="muted">—</span>`;
const statusPill = s => `<span class="pill st-${esc(s||"planned")}">${esc(STATUS[s]||STATUS.planned)}</span>`;
const nameOf = (col, id) => { const x = byId(col, id); return x ? x.name : ""; };
function opGroup(op){ for(const g in WORKS) if(WORKS[g].includes(op.workType)) return g; return op.workGroup || "Інше"; }
function opTitle(op){ return op.workType === "Інше" && op.customName ? op.customName : (op.workType || "—"); }
function opTasks(op){ return S.tasks.filter(t => t.opId === op.id); }
function opDone(op){ const ts = opTasks(op); if(ts.length) return sum(ts, t => t.area); if(op.doneArea === "" || op.doneArea == null) return op.status === "done" ? opPlanned(op) : 0; return num(op.doneArea); }
function opPlanned(op){ return num(op.plannedArea) || num((byId("fields", op.fieldId)||{}).area); }
function inPeriod(d){ return d && d >= state.period.from && d <= state.period.to; }
function hoursOf(t){ if(t.hours) return num(t.hours); if(!t.start||!t.end) return 0; const [a,b]=t.start.split(":").map(Number),[c,d]=t.end.split(":").map(Number); let m=(c*60+d)-(a*60+b); if(m<0) m+=1440; return m/60; }
function toast(msg){ const el=document.createElement("div"); el.className="toast"; el.textContent=msg; document.body.appendChild(el); setTimeout(()=>el.remove(), 2600); }

/* ---------- geometry ---------- */
function ringArea(ring){ // ring: [[lng,lat],...] → hectares
  if(!ring || ring.length < 3) return 0;
  const lat0 = ring.reduce((t,p)=>t+p[1],0)/ring.length * Math.PI/180;
  const kx = 111320*Math.cos(lat0), ky = 110540;
  let a = 0;
  for(let i=0;i<ring.length;i++){ const p=ring[i], q=ring[(i+1)%ring.length]; a += (p[0]*kx)*(q[1]*ky) - (q[0]*kx)*(p[1]*ky); }
  return Math.abs(a)/2/10000;
}
const contourArea = cs => (cs||[]).reduce((t,r)=>t+ringArea(r),0);

/* ---------- data layer (Cloudflare Worker + D1) ---------- */
let lastSync = "", pollTimer = null, authed = false;
async function api(path, opts = {}){
  const r = await fetch("/api" + path, Object.assign({ headers: { "content-type": "application/json" }, credentials: "same-origin" }, opts));
  if(r.status === 401){ authed = false; showLogin(); throw { code: "auth" }; }
  if(r.status === 503){ dbState = "nopass"; render(); throw { code: "nopass" }; }
  if(!r.ok) throw { code: "http", message: r.status + " " + (await r.text()).slice(0, 200) };
  return r.json();
}
function applyDocs(docs){
  for(const d of docs){
    if(!S[d.col]) continue;
    const i = S[d.col].findIndex(x => x.id === d.id);
    if(d.deleted){ if(i >= 0) S[d.col].splice(i, 1); }
    else { const obj = Object.assign({ id: d.id }, d.data); if(i >= 0) S[d.col][i] = obj; else S[d.col].push(obj); }
  }
}
async function initDb(){
  try {
    const j = await api("/all");
    COLS.forEach(c => S[c] = []);
    applyDocs(j.docs); lastSync = j.now; authed = true; dbState = "ready";
    render(); startPoll();
  } catch(e){ if(e.code === "http"){ dbState = "error"; render(); } }
}
function startPoll(){
  clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    if(document.hidden || !authed) return;
    try { const j = await api("/changes?since=" + encodeURIComponent(lastSync)); lastSync = j.now; if(j.docs.length){ applyDocs(j.docs); scheduleRender(); } } catch(e){}
  }, 15000);
}
let rTimer = null;
function scheduleRender(){ if(rTimer) return; rTimer = requestAnimationFrame(()=>{ rTimer=null; render(); }); }
function clean(o){ const r = {}; for(const k in o){ if(k==="id") continue; const v=o[k]; if(v===undefined) continue; r[k]=v; } return r; }
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
async function save(col, obj){
  if(!authed){ showLogin(); return null; }
  const id = obj.id || newId();
  const now = new Date().toISOString();
  const data = clean(obj); data.updatedAt = now; if(!obj.id) data.createdAt = now;
  try {
    await api("/doc/" + col + "/" + encodeURIComponent(id), { method: "PUT", body: JSON.stringify(data) });
    applyDocs([{ col, id, data }]); scheduleRender(); return id;
  } catch(e){ if(e.code === "http") toast("Не вдалося зберегти: " + e.message); return null; }
}
async function remove(col, id){
  if(!authed) return;
  try { await api("/doc/" + col + "/" + encodeURIComponent(id), { method: "DELETE" }); applyDocs([{ col, id, deleted: 1 }]); scheduleRender(); }
  catch(e){ if(e.code === "http") toast("Не вдалося видалити"); }
}
function showLogin(){
  if(document.getElementById("login")) return;
  const w = document.createElement("div"); w.id = "login"; w.className = "overlay"; w.style.zIndex = 40;
  w.innerHTML = `<form class="modal" style="width:min(380px,100%)"><header><h3>Вхід у КЛГ Агро Поле</h3></header><div class="body"><div class="f"><label class="full">Пароль<input type="password" id="lpw" autocomplete="current-password" required></label></div><div class="note" id="lerr"></div></div><footer><span class="sp"></span><button class="btn pri" type="submit">Увійти</button></footer></form>`;
  document.body.appendChild(w);
  w.querySelector("form").onsubmit = async e => {

    if(r.ok){ w.remove(); initDb(); } else w.querySelector("#lerr").textContent = r.status === 503 ? "Пароль програми ще не задано в Cloudflare." : "Невірний пароль.";
  };
  w.querySelector("#lpw").focus();
}

/* ---------- modal ---------- */
function closeModal(){ document.getElementById("modalRoot").innerHTML = ""; }
function openModal({ title, body, wide, onSave, onDelete, extra, saveLabel }){
  const root = document.getElementById("modalRoot");
  root.innerHTML = `<div class="overlay" id="ov"><div class="modal ${wide?"wide":""}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <header><h3>${esc(title)}</h3><button class="btn sm" id="mClose" type="button">Закрити</button></header>
    <form class="body" id="mForm">${body}</form>
    <footer>${onDelete ? `<button class="btn danger" id="mDel" type="button">Видалити</button>` : ""}${extra||""}<span class="sp"></span>
    <button class="btn" type="button" id="mCancel">Скасувати</button>${onSave ? `<button class="btn pri" id="mSave" type="button">${esc(saveLabel||"Зберегти")}</button>`:""}</footer>
  </div></div>`;
  const m = root.querySelector(".modal");
  root.querySelector("#mClose").onclick = closeModal;
  root.querySelector("#mCancel").onclick = closeModal;
  root.querySelector("#ov").addEventListener("mousedown", e => { if(e.target.id==="ov") closeModal(); });
  root.querySelector("#mForm").addEventListener("submit", e => e.preventDefault());
  if(onSave) root.querySelector("#mSave").onclick = async () => { const b=root.querySelector("#mSave"); b.disabled=true; const ok = await onSave(m); if(ok!==false) closeModal(); else b.disabled=false; };
  if(onDelete) root.querySelector("#mDel").onclick = () => confirmBox("Видалити запис? Це не можна скасувати.", async () => { await onDelete(); closeModal(); });
  const first = m.querySelector("input,select,textarea"); if(first) first.focus();
  return m;
}
function confirmBox(text, yes){
  const wrap = document.createElement("div");
  wrap.className = "overlay"; wrap.style.zIndex = 25;
  wrap.innerHTML = `<div class="modal" style="width:min(420px,100%)"><div class="body"><b>${esc(text)}</b></div><footer><span class="sp"></span><button class="btn" type="button">Ні</button><button class="btn danger" type="button">Так, видалити</button></footer></div>`;
  document.body.appendChild(wrap);
  const [no, ok] = wrap.querySelectorAll("button");
  no.onclick = () => wrap.remove();
  ok.onclick = async () => { wrap.remove(); await yes(); };
}

/* ---------- CSV ---------- */
function exportCsv(name, head, rows){
  const line = r => r.map(v => { const s = String(v ?? ""); return /[;"\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }).join(";");
  const text = "﻿" + [head, ...rows].map(line).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: "text/csv;charset=utf-8" }));
  a.download = name + ".csv"; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

const MT_KEY = "__MAPTILER_KEY__";
const STYLES = { sat: "https://api.maptiler.com/maps/hybrid/style.json?key=" + MT_KEY, map: "https://api.maptiler.com/maps/streets-v2/style.json?key=" + MT_KEY };
let mapStyle = lsGet("mapStyle") || "sat";
let showKadastr = false; /* map.land.gov.ua WMS does not respond at the moment; button hidden until it does */
function toggleKadastr(){ showKadastr = !showKadastr; lsSet("kadastr", showKadastr ? "1" : "0"); Object.values(MAPS).forEach(M => { if(M.map.getLayer && M.map.getLayer("kadastr")) M.map.setLayoutProperty("kadastr", "visibility", showKadastr ? "visible" : "none"); M.el.querySelector("[data-kad]").classList.toggle("on", showKadastr); }); if(showKadastr) toast("Кадастровий шар видно з наближення 12 і більше"); }
const MAPS = {}, pendingMaps = {};
const EMPTY_FC = { type: "FeatureCollection", features: [] };
function mapHtml(key, fields, parcels){
  pendingMaps[key] = { fields, parcels: parcels || [] };
  return `<div class="mapslot" data-slot="${key}"></div>`;
}
function fieldsGeo(fields){
  return { type: "FeatureCollection", features: fields.filter(f => f.contours && f.contours.length).map(f => ({ type: "Feature",
    properties: { fid: f.id, name: f.name, color: cropColor(fieldCrop(f) || "Не вказана"), crop: fieldCrop(f) || "", variety: fieldSeason(f).variety || "", group: f.group || "", area: num(f.area) },
    geometry: { type: "MultiPolygon", coordinates: f.contours.map(r => [r]) } })) };
}
const PARCEL_COLORS = { "Взяті в оренду":"#34c759", "Взяті в суборенду":"#7ee08a", "Емфітевзис":"#64d2ff", "Власність":"#0a84ff", "Здані в оренду":"#bf5af2", "Здані в суборенду":"#d29bf5", "Сервітут":"#ac8e68", "Без типу":"#bdbdbd", "Закінчується":"#ff9f0a", "Закінчився":"#ff453a" };
function parcelsGeo(parcels){
  return { type: "FeatureCollection", features: parcels.filter(p => p.contours && p.contours.length).map(p => { const st = parcelStatus(p);
    return { type: "Feature", properties: { pid: p.id, cad: p.cadastre || "", status: st, color: PARCEL_COLORS[parcelColorKey(p)] || "#bdbdbd", area: num(p.area), owner: nameOf("owners", p.ownerId) || "", council: p.council || "" },
      geometry: { type: "MultiPolygon", coordinates: p.contours.map(r => [r]) } }; }) };
}
function bboxOf(fields){
  let b = null;
  fields.forEach(f => (f.contours || []).forEach(r => r.forEach(([x, y]) => { if(!b) b = [x, y, x, y]; else { b[0] = Math.min(b[0], x); b[1] = Math.min(b[1], y); b[2] = Math.max(b[2], x); b[3] = Math.max(b[3], y); } })));
  return b;
}
function addLayers(M){

  map.addLayer({ id: "kadastr", type: "raster", source: "kadastr", minzoom: 12, layout: { visibility: showKadastr ? "visible" : "none" }, paint: { "raster-opacity": 0.85 } });

  map.addLayer({ id: "f-sel", type: "line", source: "fields", filter: ["==", ["get", "fid"], ""], paint: { "line-color": "#ff3b30", "line-width": 3 } });
  map.addLayer({ id: "f-lab", type: "symbol", source: "fields", minzoom: 11.5, layout: { "text-field": ["get", "name"], "text-size": 12, "text-font": ["Noto Sans Regular"], "text-allow-overlap": false }, paint: { "text-color": "#ffffff", "text-halo-color": "rgba(0,0,0,.85)", "text-halo-width": 1.4 } });
  map.addSource("parcels", { type: "geojson", data: EMPTY_FC });
  map.addLayer({ id: "p-fill", type: "fill", source: "parcels", paint: { "fill-color": ["get", "color"], "fill-opacity": 0.22 } });
  map.addLayer({ id: "p-line", type: "line", source: "parcels", paint: { "line-color": ["get", "color"], "line-width": 1.6, "line-dasharray": [3, 1.5] } });
  map.addLayer({ id: "p-sel", type: "line", source: "parcels", filter: ["==", ["get", "pid"], ""], paint: { "line-color": "#ff3b30", "line-width": 3 } });
  map.addSource("points", { type: "geojson", data: EMPTY_FC });
  map.addLayer({ id: "pt", type: "circle", source: "points", paint: { "circle-radius": 6, "circle-color": ["get", "color"], "circle-stroke-color": "#000", "circle-stroke-width": 1.2 } });
  map.addSource("draw", { type: "geojson", data: EMPTY_FC });
  map.addLayer({ id: "d-fill", type: "fill", source: "draw", filter: ["==", ["geometry-type"], "Polygon"], paint: { "fill-color": "#ffd60a", "fill-opacity": 0.25 } });
  map.addLayer({ id: "d-line", type: "line", source: "draw", filter: ["!=", ["geometry-type"], "Point"], paint: { "line-color": "#ffd60a", "line-width": 2.5, "line-dasharray": [2, 1] } });
  map.addLayer({ id: "d-pt", type: "circle", source: "draw", filter: ["==", ["geometry-type"], "Point"], paint: { "circle-radius": 5, "circle-color": "#ffd60a", "circle-stroke-color": "#000", "circle-stroke-width": 1 } });
}
function updateMapData(M){
  const map = M.map;
  const src = map.getSource && map.getSource("fields");
  if(!src) return;
  src.setData(fieldsGeo(M.fields));
  map.setFilter("f-sel", ["==", ["get", "fid"], state.fieldSel || ""]);
  const pts = map.getSource("points"); if(pts) pts.setData(pointsGeo());
  const ps = map.getSource("parcels"); if(ps){ ps.setData(parcelsGeo(M.parcels || [])); map.setFilter("p-sel", ["==", ["get", "pid"], state.parcelSel || ""]); }
  updateDraw(M);
  const note = M.el.querySelector(".mapnote");
  const has = M.fields.some(f => f.contours && f.contours.length) || (M.parcels || []).some(p => p.contours && p.contours.length);
  note.hidden = has || !!M.draw;
  if(!M.fitted && has){ fitFields(M); M.fitted = true; }
}
function fitFields(M){
  const b = bboxOf([...M.fields, ...(M.parcels || [])]); if(!b) return;
  M.map.fitBounds([[b[0], b[1]], [b[2], b[3]]], { padding: 40, duration: 0, maxZoom: 15 });
}
function updateDraw(M){
  const src = M.map.getSource("draw"); if(!src) return;
  const pts = M.draw ? M.draw.pts : [];
  const feats = pts.map(p => ({ type: "Feature", properties: {}, geometry: { type: "Point", coordinates: p } }));
  if(pts.length >= 3) feats.push({ type: "Feature", properties: {}, geometry: { type: "Polygon", coordinates: [[...pts, pts[0]]] } });
  else if(pts.length === 2) feats.push({ type: "Feature", properties: {}, geometry: { type: "LineString", coordinates: pts } });
  src.setData({ type: "FeatureCollection", features: feats });
  const bar = M.el.querySelector(".drawbar");
  bar.hidden = !M.draw;
  if(M.draw) bar.querySelector("span").textContent = pts.length < 3 ? `Клацайте по краю поля, щоб ставити точки (поставлено ${pts.length}).` : `Точок: ${pts.length}, площа ≈ ${fmt(ringArea([...pts, pts[0]]))} га. Натисніть «Завершити».`;
}

function markStyle(el){ el.querySelectorAll("[data-ms]").forEach(b => b.classList.toggle("on", b.dataset.ms === mapStyle)); }
function setMapStyle(s){
  if(s === mapStyle) return; mapStyle = s; lsSet("mapStyle", s);
  Object.values(MAPS).forEach(M => { if(M.map.setStyle){ M.map.setStyle(STYLES[s]); markStyle(M.el); } });
}
function startDraw(key, onDone){
  const M = MAPS[key]; if(!M || !M.map.getCanvas) return;
  M.draw = { pts: [], onDone }; M.map.getCanvas().style.cursor = "crosshair"; M.map.doubleClickZoom.disable();

/* ---------- import KML / GeoJSON ---------- */
function parseGeo(text, fname){
  const out = [];
  if(/\.kml$/i.test(fname) || text.trim().startsWith("<")){
    const x = new DOMParser().parseFromString(text, "text/xml");
    x.querySelectorAll("Placemark").forEach(pm => {
      const name = (pm.querySelector("name")||{}).textContent || "";
      const rings = [];
      pm.querySelectorAll("Polygon").forEach(pg => {
        const c = pg.querySelector("outerBoundaryIs coordinates") || pg.querySelector("coordinates");
        if(c) rings.push(c.textContent.trim().split(/\s+/).map(t => t.split(",").map(Number)).filter(p => isFinite(p[0]) && isFinite(p[1])).map(p => [p[0], p[1]]));
      });
      const ext = {}; pm.querySelectorAll("ExtendedData Data, SimpleData").forEach(d => { ext[d.getAttribute("name")] = (d.querySelector("value")||d).textContent; });
      if(rings.length) out.push({ name: name.trim() || ext.name || ext.Name || "", rings, props: ext });
    });
  } else {
    const j = JSON.parse(text);
    const feats = j.type === "FeatureCollection" ? j.features : (j.type === "Feature" ? [j] : []);
    feats.forEach(ft => {
      const g = ft.geometry; if(!g) return;
      const p = ft.properties || {};
      let rings = [];
      if(g.type === "Polygon") rings = [g.coordinates[0]];
      else if(g.type === "MultiPolygon") rings = g.coordinates.map(pg => pg[0]);
      rings = rings.map(r => r.map(c => [c[0], c[1]]));
      if(rings.length) out.push({ name: String(p.name ?? p.Name ?? p.NAME ?? p.title ?? p["Поле"] ?? "").trim(), rings, props: p });
    });
  }
  return out;
}
function importDialog(){
  openModal({ title: "Імпорт контурів полів", saveLabel: "Імпортувати",
    body: `<p class="note">Файл KML або GeoJSON з контурами. Поле з такою самою назвою отримає новий контур, решта полів створяться автоматично. Площу пораховано з контуру. Більшість GIS-програм і сервісів моніторингу вміють вивантажувати поля у KML.</p>
    <div class="f"><label class="full">Файл<input type="file" id="gFile" accept=".kml,.geojson,.json,application/vnd.google-earth.kml+xml,application/geo+json"></label>
    <label>Група для нових полів<input id="gGroup" list="groupList" placeholder="наприклад, Голованівськ"></label>
    <label>Культура сезону ${state.season} для нових<input id="gCrop" list="cropList" placeholder="необов’язково"></label></div>${groupDatalist()}${cropDatalist()}
    <div id="gInfo" class="note"></div>`,
    onSave: async (m) => {
      const file = m.querySelector("#gFile").files[0];
      if(!file){ m.querySelector("#gInfo").textContent = "Оберіть файл."; return false; }
      let items;
      try { items = parseGeo(await file.text(), file.name); } catch(e){ m.querySelector("#gInfo").textContent = "Не вдалося прочитати файл: " + e.message; return false; }
      if(!items.length){ m.querySelector("#gInfo").textContent = "У файлі не знайдено полігонів."; return false; }
      const group = val(m,"gGroup"), crop = val(m,"gCrop");
      let created=0, updated=0, i=0;
      for(const it of items){
        i++; m.querySelector("#gInfo").textContent = `Обробка ${i} з ${items.length}…`;
        const name = it.name || ("Поле " + i);
        const ex = S.fields.find(f => f.name === name);
        const area = +contourArea(it.rings).toFixed(2);
        if(ex){ await save("fields", Object.assign({}, ex, { contours: it.rings, calcArea: area, area: num(ex.area) || area })); updated++; }
        else { const seasons = crop ? { [state.season]: { crop } } : {}; await save("fields", { name, group, area, calcArea: area, contours: it.rings, seasons }); created++; }
      }
      toast(`Готово: нових полів ${created}, оновлено контурів ${updated}`);
    }
  });
}

  return { n: ts.length, area, fuel, km, h, lha: area ? fuel/area : 0 };

/* tasks */
function tasksTable(ts, compact, noMachine){
  return `<div class="tw"><table><thead><tr><th>Дата</th>${noMachine?"":"<th>Машина</th>"}<th>Робота / поле</th>${compact?"":"<th>Водій</th><th>Агрегат</th>"}<th class="n">Га</th>${compact?"":'<th class="n">Км</th><th class="n">Год.</th>'}<th class="n">Пальне, л</th>${compact?"":'<th class="n">л/га</th>'}</tr></thead><tbody>
  ${ts.map(t => { const f = byId("fields", t.fieldId); const op = byId("ops", t.opId); const lha = num(t.area) ? num(t.fuel)/num(t.area) : 0;
    return `<tr class="click" data-task="${esc(t.id)}"><td>${fdate(t.date)}<div class="note">${esc(t.start||"")}${t.end?"–"+esc(t.end):""}</div></td>${noMachine?"":`<td>${esc(nameOf("machines",t.machineId)||"—")}</td>`}
    <td>${esc(op?opTitle(op):(t.work||"—"))}<div class="note">${esc(f?f.name:(t.place||""))}</div></td>${compact?"":`<td>${esc(nameOf("people",t.driverId)||"—")}</td><td>${esc(nameOf("implements",t.implementId)||"—")}</td>`}
    <td class="n">${t.area?fmt(num(t.area)):"—"}</td>${compact?"":`<td class="n">${(num(t.kmField)+num(t.kmRoad))?fmt(num(t.kmField)+num(t.kmRoad),1):"—"}</td><td class="n">${hoursOf(t)?fmt(hoursOf(t),1):"—"}</td>`}<td class="n">${t.fuel?fmt0(num(t.fuel)):"—"}</td>${compact?"":`<td class="n">${lha?fmt(lha,1):"—"}</td>`}</tr>`; }).join("")}

}

/* reports */
function viewReports(){
  const T = state.repTab;
  const tabs = [["machines","Продуктивність машин"],["drivers","Продуктивність водіїв"],["apps","Внесення за культурами"],["harvest","Урожай"],["fuel","Пальне по полях"]];
  const ts = S.tasks.filter(t => inPeriod(t.date));
  let head = [], rows = [], nums = [];
  if(T === "machines" || T === "drivers"){
    const key = T === "machines" ? "machineId" : "driverId", col = T === "machines" ? "machines" : "people";
    const g = {}; ts.forEach(t => { const k = t[key] || ""; const o = g[k] ||= { n:0, area:0, km:0, h:0, fuel:0, days:new Set() }; o.n++; o.area+=num(t.area); o.km+=num(t.kmField)+num(t.kmRoad); o.h+=hoursOf(t); o.fuel+=num(t.fuel); o.days.add(t.date); });
    head = [T==="machines"?"Машина":"Водій","Днів роботи","Завдань","Оброблено, га","Га за день","Пробіг, км","Мотогодини","Пальне, л","л/га"];
    rows = Object.entries(g).sort((a,b)=>b[1].area-a[1].area).map(([k,o]) => [nameOf(col,k)||"(не вказано)", o.days.size, o.n, o.area, o.days.size?o.area/o.days.size:0, o.km, o.h, o.fuel, o.area?o.fuel/o.area:0]);
    nums = [1,2,3,4,5,6,7,8];
  } else if(T === "apps"){
    const g = {};
    S.ops.filter(o => Number(o.season) === state.season).forEach(o => { const f = byId("fields", o.fieldId); const crop = f ? (fieldCrop(f, o.season) || "Не вказана") : "—"; const area = opDone(o) || (o.status==="done" ? opPlanned(o) : 0); const plannedA = opPlanned(o);
      (o.applications||[]).forEach(a => { const p = byId("products", a.productId); const k = crop+"|"+a.productId; const x = g[k] ||= { crop, prod: p?p.name:"?", type: p?p.type:"", unit: a.unit, plan:0, fact:0, area:0, price: p?num(p.price):0 }; x.plan += num(a.rate)*plannedA; x.fact += num(a.rate)*area; x.area += area; }); });

    head = ["Культура","Площа, га","Зібрано з, га","% зібрано","Урожай, т","Урожайність, ц/га","План, т","Виконання плану, %"];
    rows = Object.entries(g).sort((a,b)=>b[1].area-a[1].area).map(([c,x]) => [c, x.area, x.harvA, x.area?x.harvA/x.area*100:0, x.t, x.harvA?x.t*10/x.harvA:0, x.planT, x.planT?x.t/x.planT*100:0]);
    nums = [1,2,3,4,5,6,7];

    head = ["Поле","Група","Завдань","Оброблено, га","Пальне, л","л/га"];
    rows = Object.values(g).sort((a,b)=>b.fuel-a.fuel).map(x => [x.name, x.group, x.n, x.area, x.fuel, x.area?x.fuel/x.area:0]);
    nums = [2,3,4,5];
  }
  state._report = { name: (tabs.find(t=>t[0]===T)||[])[1], head, rows };
  const needsPeriod = ["machines","drivers","fuel"].includes(T);
  return header("Звіти", `<button class="btn" type="button" data-act="csvReport">Експорт у CSV</button>`) + statusBanner() +
    `<div class="tabs">${tabs.map(([k,l])=>`<button type="button" class="${T===k?"on":""}" data-reptab="${k}">${esc(l)}</button>`).join("")}</div>` +

      ${rows.map(r=>`<tr>${r.map((v,i)=>`<td class="${nums.includes(i)?"n":""}">${nums.includes(i) ? (v? fmt(v, Number.isInteger(v)?0:(/л\/га|ц\/га|норма/.test(head[i])?1:2)) : "—") : (i===0 && T!=="fuel" && (T==="apps"||T==="harvest") ? cropTag(v) : esc(v))}</td>`).join("")}</tr>`).join("")}
      </tbody></table></div>` : `<div class="card"><div class="empty"><b>Даних для звіту немає</b>${needsPeriod?"Змініть період або внесіть завдання техніки.":"Внесіть поля й агрооперації сезону."}</div></div>`);

function landSettings(){ const s = S.settings.find(x => x.id === "land") || {}; return { pdfo: s.pdfo ?? 18, vz: s.vz ?? 5, renewSoonDays: s.renewSoonDays ?? 180 }; }
const cpName = id => nameOf("owners", id);
function docParcels(l){ return (l.parcelIds || []).map(id => byId("parcels", id)).filter(Boolean); }
function docCalcArea(l){ return sum(docParcels(l), p => num(p.area) * num(l.share || 100) / 100); }
function docArea(l){ return num(l.area) || docCalcArea(l); }
function docNgo(l){ return num(l.ngo) || sum(docParcels(l), p => num(p.ngo) * num(l.share || 100) / 100); }
function docYearPrice(l){ if(l.subtype === "Фіксований в % до НГО") return docNgo(l) * num(l.rentPercent) / 100; return num(l.pricePerYear); }
function docEnd(l){ return l.factEnd || l.dateTo || ""; }
function docState(l){
  const td = today();
  if(l.archived) return "archived";
  if(l.status === "розірваний") return "broken";
  if(["проєкт","підписаний","на реєстрації"].includes(l.status)) return "reg";
  const end = docEnd(l);
  if(end && end < td) return l.autoRenew ? "renewed" : "ended";
  if(end && (new Date(end) - new Date(td)) / 864e5 <= landSettings().renewSoonDays) return "soon";
  return "active";
}
const DSTATE = { active:["Діючий","st-done"], soon:["Закінчується","st-progress"], renewed:["Автоподовжений","st-done"], ended:["Закінчився","st-cancel"], reg:["Оформлення","st-planned"], broken:["Розірваний","st-cancel"], archived:["В архіві","st-cancel"] };
const docIsActive = l => ["active","soon","renewed","reg"].includes(docState(l));
function docPill(l){ const [t, c] = DSTATE[docState(l)]; return `<span class="pill ${c}">${t}</span>`; }
function daysLeft(l){ const e = docEnd(l); if(!e) return null; return Math.round((new Date(e) - new Date(today())) / 864e5); }
function parcelDocs(p){ return S.leases.filter(l => (l.parcelIds || []).includes(p.id)); }
function parcelActiveDoc(p){ return parcelDocs(p).filter(docIsActive).sort((a,b) => (docEnd(b)||"9999").localeCompare(docEnd(a)||"9999"))[0]; }
const parcelActiveLease = parcelActiveDoc;
const leasePill = docPill;
function parcelStatus(p){
  const d = parcelActiveDoc(p);
  if(d) return STATUS_BY_DOC[d.type] || "Без типу";
  if(parcelDocs(p).some(l => ["ended","broken"].includes(docState(l)))) return "Закінчився";
  return "Без типу";
}
function parcelColorKey(p){ const d = parcelActiveDoc(p); if(d && docState(d) === "soon") return "Закінчується"; return parcelStatus(p); }
function parcelRightEnd(p){ return parcelDocs(p).filter(docIsActive).map(docEnd).filter(Boolean).sort().pop() || ""; }
function rentForYear(l, year){
  const price = docYearPrice(l); if(!price) return 0;
  const ys = new Date(year + "-01-01"), ye = new Date(year + "-12-31");
  const a = l.dateFrom ? new Date(l.dateFrom) : ys;
  let b = docEnd(l) ? new Date(docEnd(l)) : ye;
  if(l.autoRenew && b < ye) b = ye;
  const from = a > ys ? a : ys, to = b < ye ? b : ye;
  if(to < from) return 0;
  return price * ((to - from) / 864e5 + 1) / ((ye - ys) / 864e5 + 1);
}
function taxRateFor(l){ const cp = byId("owners", l.ownerId); if(cp && cp.kind === "Юридична особа") return 0; const s = landSettings(); return num(s.pdfo) + num(s.vz); }

function landKpis(){
  const ps = S.parcels.filter(p => !p.archived);
  const act = ps.filter(p => parcelActiveDoc(p));
  const own = ps.filter(p => parcelStatus(p) === "Власність");
  const docs = S.leases.filter(l => !l.archived);
  const year = state.rentYear;
  const rentDocs = docs.filter(l => RENT_DOC_TYPES.includes(l.type));
  const accrued = sum(rentDocs, l => rentForYear(l, year));
  const paid = sum(S.payments.filter(x => Number(x.year) === year), x => num(x.gross) || num(x.net));
  return { ps, act, own, docs, accrued, paid,
    area: sum(ps, p => p.area), actArea: sum(act, p => p.area), ownArea: sum(own, p => p.area), freeArea: sum(ps.filter(p => !parcelActiveDoc(p)), p => p.area),
    activeDocs: docs.filter(docIsActive).length, soon: docs.filter(l => docState(l) === "soon"), ended: docs.filter(l => docState(l) === "ended") };
}

/* intersection analysis with turf */
let turfLoading = null;
function loadScript(src){ return new Promise((ok, fail) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => fail(new Error("Не вдалося завантажити " + src)); document.head.appendChild(s); }); }
function ensureTurf(){ if(window.turf) return Promise.resolve(); return turfLoading ||= loadScript("https://unpkg.com/@turf/turf@7.1.0/turf.min.js"); }
let landAnalysisCache = null;
function landAnalysis(){
  if(!window.turf){ ensureTurf().then(() => { landAnalysisCache = null; render(); }).catch(e => toast(e.message)); return `<div class="card"><div class="empty">Завантажую інструмент для розрахунку перетинів…</div></div>`; }
  const fields = S.fields.filter(f => !f.archived && f.contours && f.contours.length);
  const parcels = S.parcels.filter(p => !p.archived && p.contours && p.contours.length);
  const key = fields.map(f => f.id + f.updatedAt).join() + "|" + parcels.map(p => p.id + p.updatedAt).join() + "|" + S.leases.map(l => l.updatedAt).join();
  if(!landAnalysisCache || landAnalysisCache.key !== key) landAnalysisCache = { key, rows: computeIntersections(fields, parcels) };
  const rows = landAnalysisCache.rows;
  const tot = k => sum(rows, r => r[k]);
  return `<p class="note">Перетин контурів полів із контурами земельних ділянок. Показує, яка частина посівної площі покрита ділянками з діючими документами, а де обробляється земля без документів.</p>
  <div class="kpis"><div class="kpi"><b>${fmt(tot("field"),2)}</b><span>га полів з контурами</span></div><div class="kpi"><b>${fmt(tot("act"),2)}</b><span>га під ділянками з документами</span></div><div class="kpi"><b style="color:${tot("noDoc")?"var(--warn)":"inherit"}">${fmt(tot("noDoc"),2)}</b><span>га під ділянками без діючих документів</span></div><div class="kpi"><b style="color:${tot("uncovered")>0.5?"var(--bad)":"inherit"}">${fmt(tot("uncovered"),2)}</b><span>га поза ділянками</span></div></div>
  <div class="filters"><span style="flex:1"></span><button class="btn" type="button" data-act="linkParcels">Прив’язати ділянки до полів за перетином</button><button class="btn" type="button" data-act="csvAnalysis">Експорт</button></div>
  ${rows.length ? `<div class="tw"><table><thead><tr><th>Поле</th><th>Група</th><th class="n">Площа поля, га</th><th class="n">З документами</th><th class="n">Без документів</th><th class="n">Поза ділянками</th><th class="n">Покриття, %</th><th>Ділянки</th></tr></thead><tbody>
  ${rows.map(r => { const pct = r.field ? r.act / r.field * 100 : 0; return `<tr class="click" data-field-open="${esc(r.f.id)}"><td><b>${esc(r.f.name)}</b></td><td>${esc(r.f.group||"")}</td><td class="n">${fmt(r.field,2)}</td><td class="n">${fmt(r.act,2)}</td><td class="n" style="color:${r.noDoc?"var(--warn)":"inherit"}">${r.noDoc?fmt(r.noDoc,2):"—"}</td><td class="n" style="color:${r.uncovered>0.5?"var(--bad)":"inherit"}">${r.uncovered>0.01?fmt(r.uncovered,2):"—"}</td><td><div class="bar" title="${fmt0(pct)}%"><i style="width:${Math.min(100,pct)}%"></i></div></td><td class="note">${r.parcels.map(x => esc(x.p.cadastre||"?") + " (" + fmt(x.a,2) + ")").join(", ") || "—"}</td></tr>`; }).join("")}
  </tbody></table></div>` : `<div class="card"><div class="empty"><b>Немає даних для аналізу</b>Потрібні контури і полів, і земельних ділянок.</div></div>`}`;
}
function computeIntersections(fields, parcels){
  const T = window.turf;
  const mp = cs => T.multiPolygon(cs.map(r => [r]));
  const pf = parcels.map(p => { try { const g = mp(p.contours); return { p, g, bb: T.bbox(g), active: !!parcelActiveDoc(p) }; } catch(e){ return null; } }).filter(Boolean);
  return fields.map(f => {
    let fg; try { fg = mp(f.contours); } catch(e){ return null; }
    const fb = T.bbox(fg); const fieldArea = T.area(fg) / 10000;
    let act = 0, noDoc = 0; const hits = [];
    pf.forEach(x => {
      if(x.bb[0] > fb[2] || x.bb[2] < fb[0] || x.bb[1] > fb[3] || x.bb[3] < fb[1]) return;
      let inter = null; try { inter = T.intersect(T.featureCollection([fg, x.g])); } catch(e){ inter = null; }
      if(!inter) return;
      const a = T.area(inter) / 10000; if(a < 0.001) return;
      hits.push({ p: x.p, a }); if(x.active) act += a; else noDoc += a;
    });
    const covered = Math.min(fieldArea, act + noDoc);
    return { f, field: fieldArea, act: Math.min(act, fieldArea), noDoc: Math.min(noDoc, Math.max(0, fieldArea - act)), uncovered: Math.max(0, fieldArea - covered), parcels: hits.sort((a,b)=>b.a-a.a) };
  }).filter(Boolean).sort((a,b) => (b.uncovered + b.noDoc) - (a.uncovered + a.noDoc));
}
async function linkParcelsByIntersection(){
  if(!landAnalysisCache) return;
  const map = {};
  landAnalysisCache.rows.forEach(r => r.parcels.forEach(x => { if(x.a >= 0.05 || x.a >= num(x.p.area) * 0.1) (map[x.p.id] ||= new Set()).add(r.f.id); }));
  let n = 0;
  for(const [pid, set] of Object.entries(map)){
    const p = byId("parcels", pid); if(!p) continue;
    const ids = [...new Set([...(p.fieldIds || []), ...set])];
    if(ids.length !== (p.fieldIds || []).length){ await save("parcels", Object.assign({}, p, { fieldIds: ids })); n++; }
  }
  toast(n ? `Оновлено прив’язку для ${n} ділянок` : "Нових збігів не знайдено");
}

function normDate(v){
  if(v == null || v === "") return "";
  if(v instanceof Date && !isNaN(v)) return new Date(v.getTime() - v.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})/); if(m) return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return m[0];
  const months = {"січня":1,"лютого":2,"березня":3,"квітня":4,"травня":5,"червня":6,"липня":7,"серпня":8,"вересня":9,"жовтня":10,"листопада":11,"грудня":12};
  m = s.toLowerCase().match(/^(\d{1,2})\s+([а-яіїєґ']+)\s+(\d{4})/); if(m && months[m[2]]) return `${m[3]}-${String(months[m[2]]).padStart(2,"0")}-${m[1].padStart(2,"0")}`;
  return "";
}
const numCell = v => num(String(v ?? "").replace(/\s| /g, "").replace(/UAH|грн/gi, ""));
function pick(row, ...keys){
  const ks = Object.keys(row).map(k => [k, k.toLowerCase().replace(/[,.:]+$/, "").trim()]);
  const tests = [(kl, x) => kl === x, (kl, x) => kl.startsWith(x + " ") || kl.startsWith(x + ","), (kl, x) => x.length > 3 && kl.includes(x)];
  for(const t of tests) for(const x of keys) for(const [k, kl] of ks){ if(t(kl, x)){ const v = row[k]; if(v !== "" && v != null) return v; } }
  return "";
}

  for(let i = 0; i < text.length; i++){ const c = text[i];
    if(q){ if(c === '"' && text[i+1] === '"'){ cur[cur.length-1] += '"'; i++; } else if(c === '"') q = false; else cur[cur.length-1] += c; }
    else if(c === '"') q = true; else if(c === delim) cur.push(""); else if(c === "\n"){ lines.push(cur); cur = [""]; } else if(c !== "\r") cur[cur.length-1] += c; }
  if(cur.length > 1 || cur[0]) lines.push(cur);
  const head = lines.shift() || [];
  lines.forEach(l => { if(l.every(x => !x.trim())) return; const o = {}; head.forEach((h, i) => o[h.trim()] = (l[i] ?? "").trim()); rows.push(o); });
  return rows;
}
async function findOrCreateOwner(name, code, cache){
  name = String(name || "").trim(); code = String(code || "").trim(); if(!name && !code) return "";
  const key = (code || name).toLowerCase(); if(cache[key]) return cache[key];
  let o = S.owners.find(x => (code && x.code === code) || (!code && x.name.toLowerCase() === name.toLowerCase()));

  cache[key] = o.id; return o.id;
}

function stockReplay(until){
  const st = {}; const key = (w, p) => w + "|" + p;
  const get = (w, p) => st[key(w, p)] ||= { w, p, qty: 0, value: 0 };

  for(const d of docs){
    const lines = d.lines || [];
    if(d.kind === "receipt") lines.forEach(l => { const x = get(d.to, l.productId); x.qty += num(l.qty); x.value += lineSum(l); moves.push({ d, l, w: d.to, p: l.productId, qty: num(l.qty), value: lineSum(l) }); });
    if(d.kind === "issue") lines.forEach(l => { const x = get(d.from, l.productId); const c = avg(x) * num(l.qty); x.qty -= num(l.qty); x.value -= c; moves.push({ d, l, w: d.from, p: l.productId, qty: -num(l.qty), value: -c }); });
    if(d.kind === "transfer") lines.forEach(l => { const a = get(d.from, l.productId), b = get(d.to, l.productId); const c = avg(a) * num(l.qty); a.qty -= num(l.qty); a.value -= c; b.qty += num(l.qty); b.value += c; moves.push({ d, l, w: d.from, p: l.productId, qty: -num(l.qty), value: -c }, { d, l, w: d.to, p: l.productId, qty: num(l.qty), value: c }); });
    if(d.kind === "inventory") lines.forEach(l => { const x = get(d.to, l.productId); const diff = num(l.fact) - x.qty; const c = (avg(x) || num(l.price)) * diff; x.qty += diff; x.value += c; if(Math.abs(diff) > 1e-9) moves.push({ d, l, w: d.to, p: l.productId, qty: diff, value: c }); });
    if(d.kind === "production"){
      let cost = 0;
      (d.inputs || []).forEach(l => { const x = get(d.from, l.productId); const c = avg(x) * num(l.qty); cost += c; x.qty -= num(l.qty); x.value -= c; moves.push({ d, l, w: d.from, p: l.productId, qty: -num(l.qty), value: -c }); });
      const outQty = sum(lines, l => l.qty);
      lines.forEach(l => { const x = get(d.to, l.productId); const v = num(l.price) ? lineSum(l) : (outQty ? cost * num(l.qty) / outQty : 0); x.qty += num(l.qty); x.value += v; moves.push({ d, l, w: d.to, p: l.productId, qty: num(l.qty), value: v }); });
    }
  }
  return { st, moves, avg };
}

/* reports */
function wmsReports(){
  const T = state.wmsRep || "turnover";
  const tabs = [["turnover","Оборотна відомість"],["fields","Витрати ТМЦ по полях і культурах"],["ops","Списання по агроопераціях"],["suppliers","Закупівлі за постачальниками"]];
  const { moves } = stockReplay("");
  let head = [], rows = [], nums = [];
  if(T === "turnover"){
    const g = {};
    moves.forEach(mv => { if(state.whSel && mv.w !== state.whSel) return; const k = mv.w + "|" + mv.p; const x = g[k] ||= { w: mv.w, p: mv.p, sq: 0, sv: 0, iq: 0, iv: 0, oq: 0, ov: 0 }; const dt = mv.d.date || "";
      if(dt < state.period.from){ x.sq += mv.qty; x.sv += mv.value; } else if(dt <= state.period.to){ if(mv.qty >= 0){ x.iq += mv.qty; x.iv += mv.value; } else { x.oq -= mv.qty; x.ov -= mv.value; } } });
    head = ["Склад","Номенклатура","Од.","Початок, к-сть","Початок, грн","Прихід, к-сть","Прихід, грн","Розхід, к-сть","Розхід, грн","Кінець, к-сть","Кінець, грн"]; nums = [3,4,5,6,7,8,9,10];
    rows = Object.values(g).filter(x => x.sq || x.iq || x.oq).map(x => [whName(x.w), prodName(x.p), prodUnit(x.p), x.sq, x.sv, x.iq, x.iv, x.oq, x.ov, x.sq + x.iq - x.oq, x.sv + x.iv - x.ov]).sort((a,b) => (a[0]||"").localeCompare(b[0]||"","uk") || (a[1]||"").localeCompare(b[1]||"","uk"));
  } else if(T === "fields" || T === "ops"){
    const g = {};
    moves.filter(mv => mv.d.kind === "issue" && inPeriod(mv.d.date)).forEach(mv => { const f = byId("fields", mv.d.fieldId); const op = byId("ops", mv.d.opId);
      const k = T === "fields" ? (mv.d.fieldId || "-") + "|" + mv.p : (mv.d.opId || "-") + "|" + mv.p;
      const x = g[k] ||= { f, op, p: mv.p, q: 0, v: 0 }; x.q -= mv.qty; x.v -= mv.value; });
    if(T === "fields"){ head = ["Поле","Культура","Площа, га","Номенклатура","Од.","Кількість","На 1 га","Вартість, грн","Грн/га"]; nums = [2,5,6,7,8];
      rows = Object.values(g).map(x => { const a = x.f ? num(x.f.area) : 0; return [x.f ? x.f.name : "(без поля)", x.f ? fieldCrop(x.f) : "", a, prodName(x.p), prodUnit(x.p), x.q, a ? x.q / a : 0, x.v, a ? x.v / a : 0]; }).sort((a,b) => String(a[0]).localeCompare(String(b[0]),"uk",{numeric:true})); }
    else { head = ["Агрооперація","Поле","Оброблено, га","Номенклатура","Од.","Списано","Фактична норма/га","Вартість, грн"]; nums = [2,5,6,7];
      rows = Object.values(g).map(x => { const a = x.op ? opDone(x.op) : 0; return [x.op ? "№" + x.op.number + " " + opTitle(x.op) : "(без операції)", x.op ? nameOf("fields", x.op.fieldId) : "", a, prodName(x.p), prodUnit(x.p), x.q, a ? x.q / a : 0, x.v]; }); }
  } else {
    const g = {};
    S.whdocs.filter(d => d.kind === "receipt" && d.status === "posted" && inPeriod(d.date)).forEach(d => (d.lines || []).forEach(l => { const k = (d.counterpartyId || "-") + "|" + l.productId; const x = g[k] ||= { c: d.counterpartyId, p: l.productId, q: 0, v: 0 }; x.q += num(l.qty); x.v += lineSum(l); }));
    head = ["Постачальник","Номенклатура","Од.","Кількість","Сума, грн","Середня ціна, грн"]; nums = [3,4,5];
    rows = Object.values(g).map(x => [cpName(x.c) || "(не вказано)", prodName(x.p), prodUnit(x.p), x.q, x.v, x.q ? x.v / x.q : 0]).sort((a,b) => String(a[0]).localeCompare(String(b[0]),"uk"));
  }
  state._wmsReport = { name: (tabs.find(t => t[0] === T) || [])[1], head, rows };
  return `<div class="tabs" style="border:0">${tabs.map(([k,l]) => `<button type="button" class="${T===k?"on":""}" data-wmsrep="${k}">${esc(l)}</button>`).join("")}</div>${periodBar()}
  <div class="filters">${T === "turnover" ? whFilter(true) : ""}<span style="flex:1"></span><button class="btn sm" type="button" data-act="csvWmsReport">Експорт</button></div>
  ${rows.length ? `<div class="tw"><table><thead><tr>${head.map((h,i) => `<th class="${nums.includes(i)?"n":""}">${esc(h)}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${r.map((v,i) => `<td class="${nums.includes(i)?"n":""}">${nums.includes(i) ? (v ? fmt(v, /к-сть|Кількість|Списано|На 1|норма/.test(head[i]) ? 3 : 2) : "—") : esc(v)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>` : `<div class="card"><div class="empty">Немає даних за період.</div></div>`}`;
}

function issueFromOp(op){
  const f = byId("fields", op.fieldId); const area = opDone(op) || opPlanned(op);
  const lines = (op.applications || []).map(a => { const p = byId("products", a.productId) || {}; let qty = num(a.rate) * area; if(p.unit === "т" && a.unit === "кг") qty /= 1000; if(p.unit === "кг" && a.unit === "т") qty *= 1000; return { productId: a.productId, qty: +qty.toFixed(3) }; }).filter(l => l.qty > 0);
  const wh = (S.warehouses.find(w => w.group && f && w.group === f.group) || sorted("warehouses")[0] || {}).id || "";
  whDocDialog(null, { kind: "issue", opId: op.id, fieldId: op.fieldId, from: wh, lines, date: op.factTo || op.factFrom || today(), note: "Списання на агрооперацію №" + op.number });
}

function wmsAction(a, d){
  if(a === "whNew"){ whDocDialog(null, { kind: d.kind }); return true; }
  if(a === "newReq"){ reqDialog(null); return true; }

  if(a === "newPricelist"){ pricelistDialog(null); return true; }

/* ---------- machinery extras: maintenance plans, norms, fuel, harvest transport, waybills, elevators ---------- */
function machineReadings(mid){
  let km = 0, mh = 0, kmDate = "", mhDate = "";
  const take = (d, k, h) => { if(num(k) > km){ km = num(k); kmDate = d; } if(num(h) > mh){ mh = num(h); mhDate = d; } };
  S.fuelings.filter(f => f.machineId === mid).forEach(f => take(f.date, f.odometer, f.motohours));
  S.service.filter(s => s.machineId === mid && s.status === "done").forEach(s => take(s.date, s.km, s.mh));
  const x = byId("machines", mid) || {}; take(x.readingDate || "", x.odometer, x.motohours);
  return { km, mh, kmDate, mhDate };
}
function planApplies(p, x){ return (p.machineIds || []).length ? p.machineIds.includes(x.id) : (!p.subtype || p.subtype === x.subtype) && (!p.type || p.type === (x.type || "Агро")); }
function planDue(p, x){
  const last = S.service.filter(s => s.machineId === x.id && s.status === "done" && (s.planId === p.id || s.kind === p.name)).sort((a,b) => (b.date||"").localeCompare(a.date||""))[0];
  const r = machineReadings(x.id); const res = { last, r, reasons: [], state: "ok" };
  if(!last){ res.state = "unknown"; res.reasons.push("внесіть останнє виконане ТО"); return res; }
  const lastKm = last ? num(last.km) : 0, lastMh = last ? num(last.mh) : 0, lastDate = last ? last.date : (x.inServiceDate || "");
  if(num(p.everyKm)){ res.nextKm = lastKm + num(p.everyKm); const left = res.nextKm - r.km; res.reasons.push(`${fmt0(left)} км`); if(left <= 0) res.state = "late"; else if(left <= num(p.everyKm) * 0.1 && res.state !== "late") res.state = "soon"; }
  if(num(p.everyMh)){ res.nextMh = lastMh + num(p.everyMh); const left = res.nextMh - r.mh; res.reasons.push(`${fmt0(left)} мотогод.`); if(left <= 0) res.state = "late"; else if(left <= num(p.everyMh) * 0.1 && res.state !== "late") res.state = "soon"; }
  if(num(p.everyDays) && lastDate){ const d = new Date(lastDate); d.setDate(d.getDate() + num(p.everyDays)); res.nextDate = d.toISOString().slice(0,10); const left = Math.round((d - new Date(today())) / 864e5); res.reasons.push(`${left} дн.`); if(left <= 0) res.state = "late"; else if(left <= Math.max(7, num(p.everyDays) * 0.1) && res.state !== "late") res.state = "soon"; }
  return res;
}
function maintenanceDue(){
  const out = [];
  S.mplans.filter(p => !p.archived).forEach(p => S.machines.filter(x => planApplies(p, x)).forEach(x => out.push({ p, x, d: planDue(p, x) })));
  const rank = { late: 0, soon: 1, unknown: 2, ok: 3 };
  return out.sort((a,b) => rank[a.d.state] - rank[b.d.state]);
}

  c.sort((a,b) => (!!b.machineId - !!a.machineId) || (!!b.workType - !!a.workType));

/* weather (Open-Meteo through the worker) */
const weatherCache = {};
function wmo(code){ const c = Number(code); if(c === 0) return "Ясно"; if(c <= 2) return "Мінлива хмарність"; if(c === 3) return "Хмарно"; if(c <= 48) return "Туман"; if(c <= 57) return "Мряка"; if(c <= 67) return "Дощ"; if(c <= 77) return "Сніг"; if(c <= 82) return "Злива"; if(c <= 86) return "Снігопад"; return "Гроза"; }
async function loadWeather(f){
  const c = fieldCenter(f); if(!c) return null;
  const key = c.map(v => v.toFixed(2)).join(",") + "|" + (fieldSeason(f).sowDate || "");
  if(weatherCache[key] && Date.now() - weatherCache[key].t < 3600e3) return weatherCache[key].d;
  const sow = fieldSeason(f).sowDate || "";
  const d = await api("/weather?lat=" + c[1].toFixed(4) + "&lon=" + c[0].toFixed(4) + (sow ? "&from=" + sow : ""));
  weatherCache[key] = { t: Date.now(), d }; return d;
}
function weatherHtml(d, f){
  if(!d || !d.forecast || !d.forecast.daily) return `<p class="note">Погода недоступна.</p>`;
  const fc = d.forecast, cur = fc.current || {}, dl = fc.daily;
  const hist = d.history && d.history.daily ? d.history.daily : null;
  let gdd5 = 0, gdd10 = 0, rainSow = 0;
  if(hist){ hist.time.forEach((t, i) => { const avg = (num(hist.temperature_2m_max[i]) + num(hist.temperature_2m_min[i])) / 2; gdd5 += Math.max(0, avg - 5); gdd10 += Math.max(0, avg - 10); rainSow += num(hist.precipitation_sum[i]); }); }
  const past = (dl.time || []).map((t, i) => [t, num(dl.precipitation_sum[i])]).filter(([t]) => t < today());
  const rain7 = sum(past.slice(-7), x => x[1]), rain30 = sum(past.slice(-30), x => x[1]);
  const fut = (dl.time || []).map((t, i) => ({ t, max: dl.temperature_2m_max[i], min: dl.temperature_2m_min[i], p: dl.precipitation_sum[i], w: dl.wind_speed_10m_max[i], c: dl.weather_code[i] })).filter(x => x.t >= today()).slice(0, 7);
  return `<div class="kpis" style="margin-bottom:10px"><div class="kpi"><b>${cur.temperature_2m != null ? fmt(cur.temperature_2m, 0) + "°" : "—"}</b><span>${esc(wmo(cur.weather_code))} · вітер ${cur.wind_speed_10m != null ? fmt(cur.wind_speed_10m / 3.6, 1) : "—"} м/с</span></div><div class="kpi"><b>${fmt(rain7, 0)} / ${fmt(rain30, 0)}</b><span>мм опадів за 7 / 30 днів</span></div>
  ${hist ? `<div class="kpi"><b>${fmt0(gdd5)}° / ${fmt0(gdd10)}°</b><span>сума ефективних температур з дати сівби (>5° / >10°)</span></div><div class="kpi"><b>${fmt0(rainSow)}</b><span>мм опадів з дати сівби</span></div>` : ""}</div>
  <div class="tw"><table><thead><tr><th>Дата</th><th>Погода</th><th class="n">Макс / мін, °C</th><th class="n">Опади, мм</th><th class="n">Вітер, м/с</th><th>Обприскування</th></tr></thead><tbody>${fut.map(x => { const wind = num(x.w) / 3.6; const ok = wind <= 5 && num(x.p) < 1 && num(x.max) <= 25;
    return `<tr><td>${fdate(x.t)}</td><td>${esc(wmo(x.c))}</td><td class="n">${fmt(x.max,0)} / ${fmt(x.min,0)}</td><td class="n">${num(x.p)?fmt(num(x.p),1):"—"}</td><td class="n">${fmt(wind,1)}</td><td><span class="pill ${ok?"st-done":"st-progress"}">${ok?"сприятливо":"обмежено"}</span></td></tr>`; }).join("")}</tbody></table></div>
  <p class="note">Дані Open-Meteo для центру поля. «Обмежено»: вітер понад 5 м/с, опади або спека понад 25 °C.</p>`;
}

const fmtSize = b => b > 1048576 ? fmt(b / 1048576, 1) + " МБ" : fmt(b / 1024, 0) + " КБ";
async function attachFiles(m, col, id){
  if(!m || !id) return;
  const box = document.createElement("div");
  box.innerHTML = `<b>Прикріплені файли</b><div class="filedrop" tabindex="0">Перетягніть файли сюди або <label class="linkish">оберіть<input type="file" multiple hidden></label> (до 20 МБ кожен)</div><div class="filelist note">Завантаження списку…</div>`;
  m.querySelector(".body").appendChild(box);
  const list = box.querySelector(".filelist"), drop = box.querySelector(".filedrop"), input = box.querySelector("input[type=file]");
  const load = async () => { try { const j = await api("/files?col=" + col + "&id=" + encodeURIComponent(id)); list.innerHTML = j.files.length ? j.files.map(f => `<div class="filerow"><a href="/api/files/${f.id}" target="_blank" rel="noopener">${esc(f.name)}</a><span class="muted">${fmtSize(f.size)} · ${fdate((f.created||"").slice(0,10))}</span><a class="muted" href="/api/files/${f.id}?download=1">завантажити</a><button class="btn sm danger" type="button" data-fdel="${f.id}">×</button></div>`).join("") : "Файлів немає."; } catch(e){ list.textContent = "Не вдалося отримати список файлів."; } };
  const upload = async files => { for(const f of files){ if(f.size > 20 * 1048576){ toast(f.name + ": більше 20 МБ"); continue; } list.insertAdjacentHTML("afterbegin", `<div class="note">Завантажую ${esc(f.name)}…</div>`);
      const r = await fetch("/api/files?col=" + col + "&id=" + encodeURIComponent(id) + "&name=" + encodeURIComponent(f.name), { method: "POST", headers: { "content-type": f.type || "application/octet-stream" }, body: f });
      if(!r.ok) toast("Не вдалося завантажити " + f.name); } load(); };
  input.onchange = () => upload([...input.files]);
  drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("over"));
  drop.addEventListener("drop", e => { e.preventDefault(); drop.classList.remove("over"); upload([...e.dataTransfer.files]); });
  list.addEventListener("click", e => { const fid = e.target.dataset && e.target.dataset.fdel; if(fid) confirmBox("Видалити файл?", async () => { await fetch("/api/files/" + fid, { method: "DELETE" }); load(); }); });
  load();
}

function setPeriod(k){

  if(k==="today") state.period = { from: iso(d), to: iso(d) };
  if(k==="week"){ const a = new Date(d); a.setDate(a.getDate()-6); state.period = { from: iso(a), to: iso(d) }; }
  if(k==="month") state.period = { from: iso(new Date(d.getFullYear(), d.getMonth(), 1, 12)), to: iso(d) };
  if(k==="season") state.period = { from: (state.season-1)+"-07-01", to: state.season+"-12-31" };
  if(k==="year") state.period = { from: d.getFullYear()+"-01-01", to: iso(d) };
}

    if(a==="csvMach") return exportCsv("Машини", ["Машина","Тип","Підтип","Виробник","Модель","Держномер","Пальне","Трекер","Завдань","Га","Км","Мотогод.","Пальне, л"], sorted("machines").map(x=>{ const s=machineStats(x.id); return [x.name,x.type,x.subtype,x.make,x.model,x.plate,x.fuel,x.tracker,s.n,s.area,s.km,s.h,s.fuel]; }));

main.addEventListener("keydown", e => { if((e.key==="Enter"||e.key===" ") && e.target.dataset && e.target.dataset.rot){ e.preventDefault(); e.target.click(); } });
main.addEventListener("input", e => {
  const id = e.target.id;
  if(id==="fq"){ state.fieldQ = e.target.value; render(); }
  if(id==="oq"){ state.ops.q = e.target.value; render(); }
  if(id==="mq"){ state.machQ = e.target.value; render(); }
  if(id==="lq"){ state.landQ = e.target.value; render(); }
  if(id==="wq"){ state.wmsQ = e.target.value; render(); }
});
main.addEventListener("change", e => {
  const id = e.target.id;

  if(id==="og"){ state.ops.group = e.target.value; render(); }

/* attach the files block to dialogs of saved records */
[["parcelDialog","parcels"],["docDialog","leases"],["ownerDialog","owners"],["machineDialog","machines"],["fieldDialog","fields"],["whDocDialog","whdocs"],["invoiceDialog","invoices"],["serviceDialog","service"],["harvDialog","harvests"],["scoutDialog","scoutreports"],["noteDialog","notes"],["waybillDialog","waybills"],["fuelingDialog","fuelings"],["opDialog","ops"]].forEach(([fn, col]) => {
  const orig = window[fn];
  window[fn] = function(rec, ...rest){ const r = orig.call(this, rec, ...rest); if(rec && rec.id) attachFiles(lastModal(), col, rec.id); return r; };
});
const seasonSel = document.getElementById("seasonSel");
function fillSeasons(){ const c = curSeason(); const ys = []; for(let y=c-5; y<=c+2; y++) ys.push(y); if(!ys.includes(state.season)) ys.push(state.season); seasonSel.innerHTML = ys.sort().map(y=>opt(y, "Сезон "+y, state.season)).join(""); }
seasonSel.onchange = () => { state.season = Number(seasonSel.value); lsSet("season", state.season); render(); };
function route(){ const h = (location.hash||"").replace("#",""); state.view = VIEWS[h] ? h : "dash"; if(state.view !== "machines") state.machineId = null; document.getElementById("rail").classList.remove("open"); render(); window.scrollTo(0,0); }
window.addEventListener("hashchange", route);
fillSeasons(); route();
document.getElementById("logoutBtn").onclick = async () => { try { await fetch("/api/logout", { method: "POST" }); } catch(e){} authed = false; COLS.forEach(c => S[c] = []); render(); showLogin(); };
